/* ---------- student portal, part 2 ---------- */
var ANN={rows:[],lim:0};
function stuAdd(c,s){if(s==='Present')c.p++;else if(s==='Late')c.l++;else if(s==='Excused')c.e++;else if(s==='Absent')c.a++}
function stuHomeExtra(d,c){
  var h='',lim=d.lim||0;
  if(lim>0){var left=Math.max(0,lim-c.a),w=Math.min(100,Math.round(100*c.a/lim));
    h+='<section class="card"><div class="head-row"><h3 class="h3">Absences</h3><span class="pill p-'+(left===0?'bad':left<=1?'late':'present')+'">'+c.a+' of '+lim+' allowed</span></div><div style="height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden"><div style="height:100%;width:'+w+'%;background:'+(left<=1?'var(--bad)':'var(--accent)')+'"></div></div><p class="hint">'+(left===0?'You reached the limit. Talk to your instructor, or send an excuse letter if you had a valid reason.':left===1?'Only 1 absence left before the limit. Please do not miss the next class.':left+' absences left before the limit.')+'</p>'+(c.a?'<div class="acts"><button class="btn" data-act="stunew">Send excuse letter</button></div>':'')+'</section>';
  }else if(c.a>=S.alertN)h+='<section class="card"><h3 class="h3">Watch your absences</h3><p class="hint">You have '+c.a+' absences. If you had a valid reason, send an excuse letter.</p><div class="acts"><button class="btn pri" data-act="stunew">Send excuse letter</button></div></section>';
  return h;
}
function stuAnnHTML(d){
  var a=(d.ann||[]).slice(0,3);if(!a.length)return '';
  return '<section class="card"><div class="eyebrow">Announcements</div>'+a.map(function(x){return '<div class="row"><div style="flex:1;min-width:0"><span style="display:block">'+esc(x.x)+'</span><span class="sub hint">'+esc(fmtDate(x.t))+'</span></div></div>'}).join('')+'</section>';
}
function stuCal(){
  var d=ST.d,m=ST.calM||todayStr().slice(0,7),p=m.split('-'),y=+p[0],mo=+p[1],t0=todayStr(),by={},sch=stuSch(),cl={Present:'h',Late:'n',Absent:'m',Excused:'x'};
  d.rows.forEach(function(r){if(r[0].slice(0,7)===m)(by[r[0]]=by[r[0]]||[]).push(r)});
  var first=new Date(y,mo-1,1).getDay(),nd=new Date(y,mo,0).getDate(),cells='',i,k;
  ['S','M','T','W','T','F','S'].forEach(function(w){cells+='<span class="wh">'+w+'</span>'});
  for(i=0;i<first;i++)cells+='<span class="cd e"></span>';
  for(k=1;k<=nd;k++){
    var ds=m+'-'+pad(k),rs=by[ds]||[],dow=new Date(y,mo-1,k).getDay(),dots='';
    rs.forEach(function(r){if(cl[r[2]])dots+='<i class="dk '+cl[r[2]]+'"></i>'});
    if(!rs.length&&ds>=t0&&sch.some(function(x){return slotOf(x,dow)}))dots='<i class="dk s"></i>';
    cells+='<button class="cd'+(ds===t0?' today':'')+(ST.calD===ds?' sel':'')+'" type="button" data-act="studay" data-d="'+ds+'" aria-label="'+esc(wkDate(ds))+'"><b>'+k+'</b><span class="dots">'+dots+'</span></button>';
  }
  var h='<section class="card"><div class="head-row"><button class="btn sm" type="button" data-act="stucal" data-n="-1" aria-label="Previous month">&#8249;</button><h3 class="h3">'+esc(monthName(m))+'</h3><button class="btn sm" type="button" data-act="stucal" data-n="1" aria-label="Next month">&#8250;</button></div><div class="cal">'+cells+'</div>'
   +'<div class="cleg"><span><i class="dk h"></i>Present</span><span><i class="dk n"></i>Late</span><span><i class="dk x"></i>Excused</span><span><i class="dk m"></i>Absent</span><span><i class="dk s"></i>Class day</span></div></section>';
  if(ST.calD)h+=stuDayCard(ST.calD);
  return h;
}
function stuDayCard(ds){
  var d=ST.d,t0=todayStr(),dow=parseDate(ds).getDay(),hol=(d.hol||[]).filter(function(h){return h.d<=ds&&ds<=(h.e||h.d)});
  var list=stuSch().filter(function(x){return slotOf(x,dow)}),rs=d.rows.filter(function(r){return r[0]===ds});
  var h='<section class="card"><div class="eyebrow">'+(ds===t0?'Today':ds<t0?'Past':'Coming up')+'</div><h3 class="h3">'+esc(wkDate(ds))+'</h3>'+(hol.length?'<p class="hint"><b>'+esc(hol[0].n)+'</b> (holiday or suspension)</p>':'');
  if(!list.length&&!rs.length)return h+'<p class="muted">No class on this day.</p></section>';
  return h+list.map(function(x){
    var z=slotOf(x,dow),r=rs.find(function(q){return norm(q[1])===norm(x.subject)});
    return '<div class="row"><div style="flex:1;min-width:0"><strong>'+esc(x.subject)+'</strong><span class="sub hint" style="display:block">'+esc(fmt12(z.start)+(z.end?' to '+fmt12(z.end):'')+' \u00b7 '+modeLbl(z))+'</span></div>'+(r?(r[2]==='No class'?'<span class="pill p-absent">No class</span>':stuPill(r[2])):'<span class="pill p-absent">'+(ds>t0?'Scheduled':ds===t0?'Today':'No record')+'</span>')+'</div>'}).join('')+'</section>';
}
function stuChart(d,rows){
  rows=rows||d.rows;
  var by={},cl={};
  rows.forEach(function(r){if(r[2]==='No class')return;stuAdd(by[r[0]]=by[r[0]]||{p:0,l:0,e:0,a:0},r[2])});
  d.rows.forEach(function(r){if(r[2]==='No class')return;stuAdd(cl[r[1]]=cl[r[1]]||{p:0,l:0,e:0,a:0},r[2])});
  var n=ST.chN||14,days=Object.keys(by).sort().slice(-n),h='';
  if(days.length){
    var mx=1,tot={p:0,l:0,e:0,a:0},WD=['S','M','T','W','T','F','S'],pm='';
    days.forEach(function(k){var b=by[k];mx=Math.max(mx,b.p+b.l+b.e+b.a);tot.p+=b.p;tot.l+=b.l;tot.e+=b.e;tot.a+=b.a});
    var unit=Math.min(28,Math.floor(112/mx)),seg=[['p','var(--ok)','present'],['l','var(--late)','late'],['e','var(--exc)','excused'],['a','var(--bad)','absent']];
    h='<section class="card"><div class="head-row"><div class="eyebrow">Attendance by day</div><div class="seg">'+[7,14,30].map(function(k){return '<button class="btn sm'+(n===k?' on':'')+'" type="button" data-act="stuch" data-n="'+k+'" aria-pressed="'+(n===k)+'">'+k+'</button>'}).join('')+'</div></div>'
     +'<p class="hint">Last '+days.length+' class day'+(days.length>1?'s':'')+': '+tot.p+' present, '+tot.l+' late, '+tot.e+' excused, '+tot.a+' absent.</p>'
     +'<div id="stu-ch" style="overflow-x:auto;margin-top:6px"><div style="display:flex;min-width:'+(days.length*22)+'px">'
     +days.map(function(k){
        var b=by[k],dt=parseDate(k),mo=dt.toLocaleDateString('en-PH',{month:'short'}),lab=mo!==pm?mo:'\u00a0';pm=mo;
        var title=wkDate(k)+': '+seg.filter(function(q){return b[q[0]]}).map(function(q){return b[q[0]]+' '+q[2]}).join(', ');
        return '<div title="'+esc(title)+'" aria-label="'+esc(title)+'" style="flex:1 0 22px;min-width:0;display:flex;flex-direction:column;align-items:center">'
         +'<div style="width:100%;height:'+(unit*mx+(mx-1)*2+6)+'px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:3px"><div style="width:70%;max-width:34px;display:flex;flex-direction:column-reverse;gap:2px">'
         +seg.map(function(q){return b[q[0]]?'<div style="height:'+(b[q[0]]*unit+(b[q[0]]-1)*2)+'px;background:'+q[1]+';border-radius:6px"></div>':''}).join('')+'</div></div>'
         +'<b style="font-size:12px;margin-top:8px">'+dt.getDate()+'</b><span class="hint" style="font-size:11px">'+WD[dt.getDay()]+'</span><span class="hint" style="font-size:10px">'+lab+'</span></div>'}).join('')
     +'</div></div><div class="cleg" style="margin-top:10px"><span><i class="dk h"></i>Present</span><span><i class="dk n"></i>Late</span><span><i class="dk x"></i>Excused</span><span><i class="dk m"></i>Absent</span></div></section>';
  }
  var ks=Object.keys(cl);
  if(ks.length>1)h+='<section class="card"><div class="eyebrow">By class</div>'+ks.map(function(k){var b=cl[k],r=rateOf(b.p,b.l,b.e,b.a)||0;
    return '<div style="margin-top:10px"><div class="head-row"><span style="min-width:0">'+esc(k)+'</span><b>'+r+'%</b></div><div style="height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden"><div style="height:100%;width:'+r+'%;background:var(--accent)"></div></div></div>'}).join('')+'</section>';
  return h;
}
function stuMeExtra(){
  var m=ST.d.me,np=window.Notification?Notification.permission:'denied';
  return '<section class="card"><h3 class="h3">My QR</h3><p class="hint">Show this to your secretary when you are scanned. It is the same QR as your ID.</p><div class="acts"><button class="btn pri" data-act="stuqr">Show my QR</button><button class="btn" data-act="stuprint">Print or save my record</button></div></section>'
   +(window.Notification?'<section class="card"><h3 class="h3">Notifications</h3><p class="hint">'+(np==='granted'?'On. You get a notice when you are marked absent, a letter is reviewed, or there is an announcement. Notices appear when you open or refresh the app.':'Turn on to get notices on this phone when you open or refresh the app.')+'</p>'+(np==='granted'?'':'<div class="acts"><button class="btn" data-act="stunotif">Turn on notifications</button></div>')+'</section>':'');
}
function stuPrint(){
  var d=ST.d,m=d.me,c=stuStats(d.rows),rows=d.rows.filter(function(r){return r[2]!=='No class'}).sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:0});
  var td='style="border-bottom:1px solid #ccc;padding:5px 4px;text-align:left"';
  $('#print').innerHTML='<div style="font-family:sans-serif;color:#000;padding:8px"><h2 style="margin:0">TALAAN attendance record</h2><p style="margin:6px 0">'+esc(m.n)+(m.c?' \u00b7 ID '+esc(m.c):'')+(d.section?' \u00b7 '+esc(d.section):'')+'<br>Printed '+esc(new Date().toLocaleDateString('en-PH',{year:'numeric',month:'long',day:'numeric'}))+'</p><p><b>Present '+c.p+' \u00b7 Late '+c.l+' \u00b7 Excused '+c.e+' \u00b7 Absent '+c.a+(c.r==null?'':' \u00b7 Rate '+c.r+'%')+'</b></p><table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th '+td+'>Date</th><th '+td+'>Class</th><th '+td+'>Status</th><th '+td+'>Time in</th></tr>'
   +rows.map(function(r){return '<tr><td '+td+'>'+esc(r[0])+'</td><td '+td+'>'+esc(r[1])+'</td><td '+td+'>'+esc(r[2])+'</td><td '+td+'>'+esc(r[3]||'')+'</td></tr>'}).join('')+'</table></div>';
  var old=document.title;document.title='attendance-record';window.print();setTimeout(function(){document.title=old},1500);
}
function stuNotify(prev,next){
  if(!prev||!prev.rows||!next)return;var msgs=[],seen={},ps={},pa={};
  prev.rows.forEach(function(r){seen[r[0]+'|'+norm(r[1])+'|'+r[2]]=1});
  next.rows.forEach(function(r){if(r[2]==='Absent'&&!seen[r[0]+'|'+norm(r[1])+'|Absent'])msgs.push('Marked absent: '+r[1]+' ('+fmtDate(r[0])+')')});
  (prev.exc||[]).forEach(function(x){ps[x.id]=x.st});
  (next.exc||[]).forEach(function(x){if(ps[x.id]&&ps[x.id]!==x.st)msgs.push('Excuse letter '+x.st.toLowerCase()+': '+x.subj)});
  if(prev.ann!==undefined){(prev.ann||[]).forEach(function(a){pa[a.id]=1});(next.ann||[]).forEach(function(a){if(!pa[a.id])msgs.push('New announcement: '+a.x.slice(0,60))})}
  if(!msgs.length)return;
  toast(msgs[0]+(msgs.length>1?' (+'+(msgs.length-1)+' more)':''));
  if(window.Notification&&Notification.permission==='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(function(r){msgs.slice(0,3).forEach(function(t){r.showNotification('TALAAN',{body:t,tag:'talaan-stu-'+t.length,icon:'icon-192.png'})})}).catch(function(){});
}
function isStandalone(){try{return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}catch(e){return false}}
function stuInstallBody(){
  if(isStandalone())return '<p class="hint">TALAAN is already installed on this phone.</p>';
  if(S.installEvt)return '<p class="hint">Add TALAAN to your home screen so it opens like an app and still works when the signal is weak.</p><div class="acts"><button class="btn pri" data-act="install">Install app</button></div>';
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  return '<p class="hint">'+(ios?'On iPhone or iPad: open this page in Safari, tap the Share button, then tap Add to Home Screen.':'Open your browser menu (the three dots) and tap Install app or Add to Home screen.')+'</p>';
}
function stuWkCard(){return '<section class="card"><h3 class="h3">Weekly schedule</h3><p class="hint">Save your whole week as a picture to keep on your phone or send to classmates.</p><div class="acts"><button class="btn pri" data-act="wkimg">Download image</button><button class="btn" data-act="wk">Preview</button><button class="btn" data-act="wkshare">Share</button></div></section>'}
function stuRemCfg(){var o={};try{o=JSON.parse(ls.get('talaan-sturem')||'{}')||{}}catch(e){}return {on:!!o.on,min:o.min===undefined?15:Number(o.min)||15}}
function stuSaveRem(c){ls.set('talaan-sturem',JSON.stringify(c))}
function stuRemBody(){
  var c=stuRemCfg(),o=[5,10,15,20,30,45,60],np=('Notification' in window)?Notification.permission:'none';
  return '<p class="hint">Get a reminder before each class on your schedule.</p>'
   +'<div><label for="f-sturemmin">Remind me</label><select id="f-sturemmin">'+o.map(function(m){return '<option value="'+m+'"'+(m===c.min?' selected':'')+'>'+m+' minutes before class</option>'}).join('')+'</select></div>'
   +'<div class="acts"><button class="btn sm pri" data-act="sturemics">Add to my calendar</button></div>'
   +'<p class="hint"><b>Best way:</b> tap Add to my calendar and open the file. Your calendar app then rings for every class, every week, even when TALAAN is closed. If your schedule changes, delete the old entries and add the calendar again.</p>'
   +'<label class="daybox" for="f-sturemon" style="align-self:flex-start"><input type="checkbox" id="f-sturemon"'+(c.on?' checked':'')+'>Also remind me inside TALAAN</label>'
   +'<div class="acts"><button class="btn sm" data-act="sturemperm">Allow notifications</button></div>'
   +'<p class="hint">'+(np==='granted'?'Notifications are allowed. ':np==='denied'?'Notifications are blocked in your browser settings. ':'')+'The in-app reminder works only while TALAAN is open or running in the background. A web app cannot wake up by itself when it is fully closed, so use the calendar for that.</p>';
}
function stuRemDue(){
  var c=stuRemCfg();if(!c.on)return [];
  var d=ST.d;if(!d){try{d=JSON.parse(ls.get('talaan-studata')||'null')}catch(e){}}if(!d)return [];
  var now=new Date(),td=todayStr(),out=[];
  normSched(d.sch||[]).forEach(function(sc){
    var sl=slotOf(sc,now.getDay());if(!sl||!sl.start)return;
    var p=sl.start.split(':').map(Number),st=new Date(now.getFullYear(),now.getMonth(),now.getDate(),p[0],p[1]||0),ms=st-now;
    if(ms<=0||ms>c.min*60000)return;
    if((d.hol||[]).some(function(h){return h.d<=td&&td<=(h.e||h.d)&&(!h.c||norm(h.c)===norm(sc.subject))}))return;
    if((d.rows||[]).some(function(r){return r[0]===td&&norm(r[1])===norm(sc.subject)&&r[2]==='No class'}))return;
    var key='talaan-rem-'+td+'-stu-'+(sc.id||norm(sc.subject))+'-'+sl.start;if(ls.get(key))return;
    out.push({sc:sc,sl:sl,key:key,mins:Math.max(1,Math.ceil(ms/60000))});
  });
  return out;
}
function stuRemCheck(){
  if(!needLogin()||!stuSess()||(LK.on&&LK.mode==='lock'))return;
  var L=stuRemDue();if(!L.length)return;
  try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('talaan-rem-')===0&&k.indexOf('talaan-rem-'+todayStr())!==0)localStorage.removeItem(k)})}catch(e){}
  L.forEach(function(x){ls.set(x.key,'1');var t=remText(x);remNotify('Class reminder',t);toast('Reminder: '+t)});
}
function stuAct2(a,d){
  switch(a){
    case 'stuch':ST.chN=parseInt(d.n,10)||14;render();return true;
    case 'sturemics':{var sc=stuSch();if(!sc.length){toast('No classes on your schedule yet.');return true}var ic=remIcs(sc,stuRemCfg().min);saveFile('talaan-class-reminders.ics',new Blob([ic.text],{type:'text/calendar;charset=utf-8'}));setTimeout(function(){toast('Open the file to add '+ic.n+' weekly class'+(ic.n>1?'es':'')+' to your calendar.')},400);return true}
    case 'sturemperm':if(!('Notification' in window)){toast('This browser does not support notifications.');return true}Notification.requestPermission().then(function(p){toast(p==='granted'?'Notifications allowed.':'Notifications are not allowed.');render()});return true;
    case 'stucal':{var m=ST.calM||todayStr().slice(0,7),p=m.split('-'),dt=new Date(+p[0],+p[1]-1+parseInt(d.n,10),1);ST.calM=dt.getFullYear()+'-'+pad(dt.getMonth()+1);ST.calD='';render();return true}
    case 'studay':ST.calD=ST.calD===d.d?'':d.d;render();return true;
    case 'stuqr':S.sheet={type:'myqr'};renderSheet();return true;
    case 'stuprint':stuPrint();return true;
    case 'stunotif':if(window.Notification)Notification.requestPermission().then(function(p){toast(p==='granted'?'Notifications are on.':'Notifications were not allowed.');render()});return true;
    case 'annopen':S.sheet={type:'ann'};renderSheet();annCall({op:'list'});return true;
    case 'annadd':{var x=String(fv('f-annx')||'').trim();if(!x){toast('Type the announcement first.');return true}annCall({op:'add',text:x},function(){delete S.f['f-annx'];toast('Posted.')});return true}
    case 'anndel':annCall({op:'del',id:d.id},function(){toast('Deleted.')});return true;
    case 'annlim':annCall({op:'lim',lim:parseInt(fv('f-annlim',ANN.lim),10)||0},function(){toast('Limit saved.')});return true;
  }
  return false;
}
async function annCall(b,ok){
  if(!S.gs||!S.gs.role||!S.gs.url){toast('Sign in as secretary or admin first.');return}
  b.action='excAnn';var r;try{r=await gsRead(b)}catch(e){toast('Cannot reach the server.');return}
  if(r&&r.ok){ANN.rows=r.ann||[];ANN.lim=r.lim||0;if(ok)ok();if(S.sheet&&S.sheet.type==='ann')renderSheet()}
  else toast('Could not save. Update the Apps Script first (student-portal.gs).');
}
function annSheetHTML(){
  return '<div class="fields"><h2 class="h2">Student announcements</h2><div><label for="f-annx">New announcement</label><textarea id="f-annx" rows="3" maxlength="300" placeholder="e.g. No class tomorrow. Quiz on Friday.">'+esc(fv('f-annx'))+'</textarea></div><div class="acts"><button class="btn pri" data-act="annadd">Post</button></div>'
   +(ANN.rows.length?ANN.rows.map(function(a){return '<div class="row" style="border-top:1px solid var(--line)"><div style="flex:1;min-width:0"><span style="display:block">'+esc(a.x)+'</span><span class="sub hint">'+esc(fmtDate(a.t))+'</span></div><button class="btn sm bad" data-act="anndel" data-id="'+esc(a.id)+'">Delete</button></div>'}).join(''):'<p class="hint">No announcements yet.</p>')
   +'<div><label for="f-annlim">Absences allowed per student (0 = no limit)</label><input type="number" id="f-annlim" min="0" max="50" value="'+esc(fv('f-annlim',ANN.lim))+'"></div><div class="acts"><button class="btn" data-act="annlim">Save limit</button><button class="btn" data-act="closesheet">Close</button></div></div>';
}
function myqrHTML(){var m=ST.d.me;return '<div class="fields" style="text-align:center"><h2 class="h2">'+esc(m.n)+'</h2><div class="myqr" style="width:260px;max-width:72vw;margin:0 auto;background:#fff;padding:14px;border-radius:18px">'+qrSVG(m.c||m.n)+'</div><p class="hint">Turn your screen brightness up so it scans easily.</p><button class="btn" data-act="closesheet">Close</button></div>'}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.stuOn&&stuSess())stuLoad(true)});
setInterval(stuRemCheck,30000);setTimeout(stuRemCheck,3000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)stuRemCheck()});
document.addEventListener('change',function(e){var t=e.target;if(!t||!t.id)return;
  if(t.id==='f-sturemmin'){var c=stuRemCfg();c.min=parseInt(t.value,10)||15;stuSaveRem(c);toast('Reminders set to '+c.min+' minutes before class.');render()}
  else if(t.id==='f-sturemon'){var c2=stuRemCfg();c2.on=t.checked;stuSaveRem(c2);if(t.checked&&('Notification' in window)&&Notification.permission==='default')Notification.requestPermission();toast(t.checked?'Reminders on.':'Reminders off.');render()}
});

/* ---------- wiring ---------- */
document.addEventListener('click',function(e){
  autoBak();
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  act(b.dataset.act,b.dataset);
});
document.addEventListener('input',function(e){
  var t=e.target;if(!t.id||!t.matches('input,textarea,select'))return;
  S.f[t.id]=t.type==='checkbox'?t.checked:t.value;
  if(t.id==='f-q')partial('manual-results',manualResults);
  else if(t.id==='f-newname')partial('link-results',linkResults);
  else if(t.id==='cam-name')camSug();
  else if(t.id==='f-sq')partial('roster-results',rosterResults);
  else if(t.id==='f-rmonth'||t.id==='f-rqstart'){if(t.value){setRange(S.range.mode,t.value);render()}}
  else if(t.id==='f-rfrom'||t.id==='f-rto'){if(t.id==='f-rfrom')S.range.from=t.value;else S.range.to=t.value;render()}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&(e.target.id==='cam-name'||e.target.id==='cam-email')){e.preventDefault();camSave(($('#cam-name')||{}).value)}});
document.addEventListener('submit',function(e){e.preventDefault();var n=e.target.dataset&&e.target.dataset.form;if(n)submitForm(n)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheet){S.sheet=null;renderSheet()}});
function bindFile(id,mode){
  var el=document.getElementById(id);
  el.addEventListener('change',function(){var f=el.files&&el.files[0];el.value='';scanFile(f,mode)});
}
bindFile('f-cam','scan');bindFile('f-gal','scan');bindFile('f-reg','reg');
(function(){var el=document.getElementById('f-bak');el.addEventListener('change',function(){var f=el.files&&el.files[0];el.value='';readBackup(f)})})();

window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();S.installEvt=e;if(S.tab==='scan'||S.stuOn)render()});
window.addEventListener('appinstalled',function(){S.installEvt=null;render()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}

init();
})();
</script>
