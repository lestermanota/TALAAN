<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TALAAN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#4A1214">
<script>try{var tt=localStorage.getItem("talaan-theme");if(tt==="dark"||tt==="light")document.documentElement.setAttribute("data-theme",tt)}catch(e){}</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Talaan">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Design: soft light surfaces, one indigo accent, Manrope type, a floating tab bar with a raised center Scan button, and a big round Scan button in the middle of the home screen. */
:root{
  color-scheme:light;
  --bg:#F3EBDC; --surface:#FBF7EF; --surface-2:#EDE3D1; --fg:#3A2423; --muted:#6F5E59; --line:#DFD2BC;
  --accent:#7F2327; --accent-fg:#FFF8EC; --accent-soft:#F1DFD3;
  --ok:#25765A; --ok-bg:#DFEDE0; --late:#8A5A14; --late-bg:#F4E6C8; --exc:#42609B; --exc-bg:#E2E7F1; --bad:#B03A35; --bad-bg:#F3DDD7;
  --shade:rgba(43,10,12,.5);
  --sh1:0 1px 2px rgba(60,20,16,.06),0 6px 18px rgba(60,20,16,.06);
  --sh-nav:0 12px 32px rgba(60,20,16,.18),0 2px 6px rgba(60,20,16,.07);
  --sh-fab:0 10px 24px rgba(138,26,31,.40);
  --sh-btn:0 18px 40px rgba(138,26,31,.30);
  --av-bg-s:80%; --av-bg-l:91%; --av-fg-s:55%; --av-fg-l:34%;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1413; --surface:#271B1A; --surface-2:#322322; --fg:#E9DDD0; --muted:#A8978E; --line:#41302D;
    --accent:#E3B24F; --accent-fg:#2A1A10; --accent-soft:#3A2B1A;
    --ok:#86C9A5; --ok-bg:#1B2F27; --late:#E3B467; --late-bg:#3A2D18; --exc:#A9BBE6; --exc-bg:#242B40; --bad:#EE9C93; --bad-bg:#3C2220;
    --shade:rgba(10,4,4,.55);
    --sh1:0 1px 0 rgba(255,255,255,.03) inset;
    --sh-nav:0 12px 32px rgba(0,0,0,.45);
    --sh-fab:0 10px 24px rgba(227,178,79,.20);
    --sh-btn:0 18px 40px rgba(227,178,79,.14);
    --av-bg-s:35%; --av-bg-l:22%; --av-fg-s:80%; --av-fg-l:80%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#1D1413; --surface:#271B1A; --surface-2:#322322; --fg:#E9DDD0; --muted:#A8978E; --line:#41302D;
    --accent:#E3B24F; --accent-fg:#2A1A10; --accent-soft:#3A2B1A;
    --ok:#86C9A5; --ok-bg:#1B2F27; --late:#E3B467; --late-bg:#3A2D18; --exc:#A9BBE6; --exc-bg:#242B40; --bad:#EE9C93; --bad-bg:#3C2220;
    --shade:rgba(10,4,4,.55);
    --sh1:0 1px 0 rgba(255,255,255,.03) inset;
    --sh-nav:0 12px 32px rgba(0,0,0,.45);
    --sh-fab:0 10px 24px rgba(227,178,79,.20);
    --sh-btn:0 18px 40px rgba(227,178,79,.14);
    --av-bg-s:35%; --av-bg-l:22%; --av-fg-s:80%; --av-fg-l:80%;
    color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;font-weight:500;letter-spacing:-.005em;-webkit-text-size-adjust:100%;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul,ol{margin:0}
ul{padding:0;list-style:none}
.in{width:100%;max-width:560px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px;line-height:1.4}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand svg{flex:none;border-radius:11px}
.brand-t{min-width:0}
.brand-name{font-family:var(--body);font-weight:800;font-size:20px;letter-spacing:.09em;line-height:1.1}
.brand-sub{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.chip{display:inline-flex;align-items:center;gap:8px;max-width:54%;min-height:38px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);box-shadow:var(--sh1);font-size:13px;font-weight:700}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.banner{padding-bottom:10px}
.banner p{background:var(--late-bg);color:var(--late);font-size:13px;font-weight:600;padding:10px 14px;border-radius:14px}

/* shell */
main.in{padding-top:6px;padding-bottom:132px;display:flex;flex-direction:column;gap:16px}
.title{font-family:var(--body);font-weight:800;font-size:28px;letter-spacing:-.035em;line-height:1.1}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tabs-in{pointer-events:auto;width:100%;max-width:520px;margin-inline:auto;display:grid;grid-template-columns:1fr 1fr 92px 1fr 1fr;grid-template-rows:60px;align-items:stretch;height:66px;padding:0 6px 6px;background:var(--surface);background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:30px;box-shadow:var(--sh-nav)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;border:0;background:none;color:var(--muted);font-size:11px;font-weight:700;border-radius:16px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;width:18px;height:3px;border-radius:3px;background:var(--accent)}
.tab-scan{overflow:visible;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;border:0;background:none;padding:0 0 3px;color:var(--accent);font-size:11px;font-weight:800}
.tab-scan>*{flex:none}
.fab{position:relative;display:block;width:68px;height:68px;padding:0;border-radius:50%;background:#4A1214;color:var(--accent-fg);border:4px solid var(--bg);box-shadow:var(--sh-fab);transition:transform .15s}
.fab .mas{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden}
.fab-ico{position:absolute;right:-7px;bottom:-5px;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--accent);color:var(--accent-fg);border:3px solid var(--bg);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.fab-ico svg{width:13px;height:13px;stroke-width:2.8}
.tab-scan:active .fab{transform:scale(.93)}
.tab-scan[aria-current="page"] .fab{box-shadow:0 0 0 5px var(--accent-soft),var(--sh-fab)}

/* cards and type */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh1)}
.card-flat{padding-block:8px}
.h2{font-family:var(--body);font-weight:800;font-size:21px;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
.h3{font-family:var(--body);font-weight:800;font-size:17px;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 18px;border-radius:14px;border:0;background:var(--surface-2);font-weight:700;font-size:14.5px;text-align:center;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.sm{min-height:38px;padding:7px 14px;font-size:13.5px;border-radius:12px}
.btn.pri{background:var(--accent);color:var(--accent-fg);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 28%,transparent)}
.btn.bad{background:var(--bad-bg);color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;white-space:nowrap}
.p-present{background:var(--ok-bg);color:var(--ok)}
.p-late{background:var(--late-bg);color:var(--late)}
.p-excused{background:var(--exc-bg);color:var(--exc)}
.p-absent{background:var(--surface-2);color:var(--muted)}
.p-noqr{background:var(--late-bg);color:var(--late)}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],textarea{width:100%;min-height:48px;padding:11px 14px;font-size:16px;font-weight:600;background:var(--surface-2);border:1.5px solid transparent;border-radius:14px}
input::placeholder,textarea::placeholder{color:var(--muted);font-weight:500}
input:focus,textarea:focus{outline:0;border-color:var(--accent);background:var(--surface)}
textarea{min-height:120px;resize:vertical;font-family:var(--mono);font-size:14px;font-weight:500}
.fields{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inline{display:flex;gap:8px;align-items:flex-end}
.inline>div{flex:1;min-width:0}
.err{color:var(--bad);font-size:13px;font-weight:700}
.link{background:none;border:0;color:var(--accent);font-weight:700;font-size:14px;padding:6px;min-height:36px}
.field-ic{position:relative}
.field-ic>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.field-ic input{padding-left:44px}

/* avatars */
.av{flex:none;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;font-size:13.5px;font-weight:800;letter-spacing:.02em;background:hsl(var(--h) var(--av-bg-s) var(--av-bg-l));color:hsl(var(--h) var(--av-fg-s) var(--av-fg-l))}

/* home: class summary */
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:14px}
.hero-top>div:first-child{min-width:0}
.ring{flex:none}
.ring-t{font-family:var(--body);font-weight:800;font-size:14px;fill:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-stat{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:700}
.chip-stat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip-stat.s-p::before{background:var(--ok)}
.chip-stat.s-l::before{background:var(--late)}
.chip-stat.s-e::before{background:var(--exc)}
.chip-stat b{font-variant-numeric:tabular-nums}
.sess-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.meta{font-size:13px;color:var(--muted);font-weight:600}

/* home: scan button */
.scan-zone{display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 0 8px;text-align:center}
.scan-btn{position:relative;display:block;width:168px;height:168px;padding:0;border-radius:50%;border:0;background:#4A1214;color:var(--accent-fg);box-shadow:var(--sh-btn);transition:transform .15s;-webkit-tap-highlight-color:transparent}
.scan-btn .mas{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden}
.scan-btn:active{transform:scale(.97)}
.scan-ico{position:absolute;right:2px;bottom:2px;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-fg);border:4px solid var(--bg);box-shadow:0 4px 10px rgba(60,20,16,.3)}
.scan-ico svg{width:22px;height:22px}
.scan-btn::before,.scan-btn::after{content:"";position:absolute;border-radius:50%;border:2px solid var(--accent);pointer-events:none}
.scan-btn::before{inset:-14px;opacity:.3}
.scan-btn::after{inset:-30px;opacity:.14}
.scan-btn:disabled{background:var(--surface-2);color:var(--muted);box-shadow:none;cursor:not-allowed}
.scan-btn:disabled .mas{filter:grayscale(1);opacity:.4}
.scan-btn:disabled .scan-ico{background:var(--surface-2);color:var(--muted);box-shadow:none}
.scan-btn:disabled::before,.scan-btn:disabled::after{opacity:0}
@media (prefers-reduced-motion:no-preference){
  .scan-btn.busy::before{animation:pulse 1.2s ease-out infinite}
  .scan-btn.busy::after{animation:pulse 1.2s .3s ease-out infinite}
}
@keyframes pulse{from{transform:scale(.94);opacity:.5}to{transform:scale(1.08);opacity:0}}
.scan-cap{display:flex;flex-direction:column;gap:2px;max-width:300px}
.scan-cap strong{font-family:var(--body);font-weight:800;font-size:20px;letter-spacing:-.025em}
.pair .btn,main>.acts .btn{background:var(--surface);box-shadow:var(--sh1),inset 0 0 0 1px var(--line)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:360px}

/* results and manual entry */
.res{border-width:1.5px}
.res-ok{border-color:var(--ok);background:var(--ok-bg)}
.res-late{border-color:var(--late);background:var(--late-bg)}
.res-dup{border-color:var(--exc);background:var(--exc-bg)}
.res-fail{border-color:var(--bad);background:var(--bad-bg)}
.res .name{font-family:var(--body);font-weight:800;font-size:22px;letter-spacing:-.025em;line-height:1.15;text-wrap:balance}
.res-main{display:flex;align-items:center;gap:12px}
.res-main .av{width:48px;height:48px;font-size:16px}
.res-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.raw{font-size:13px;word-break:break-all;background:var(--surface);border-radius:12px;padding:10px 12px}
.nomatch{display:flex;flex-direction:column;align-items:flex-start;gap:8px}

/* setup steps */
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.step .n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px}
.step.done .n{background:var(--ok-bg);color:var(--ok)}
.step p{font-size:13.5px;color:var(--muted)}
.step strong{display:block;font-size:14.5px}

/* stats and lists */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{border-radius:18px;padding:12px 6px;text-align:center;background:var(--surface-2)}
.stat b{display:block;font-family:var(--body);font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.stat.s-p{background:var(--ok-bg)}.stat.s-p b,.stat.s-p span{color:var(--ok)}
.stat.s-l{background:var(--late-bg)}.stat.s-l b,.stat.s-l span{color:var(--late)}
.stat.s-e{background:var(--exc-bg)}.stat.s-e b,.stat.s-e span{color:var(--exc)}
.stat.s-a b,.stat.s-a span{color:var(--muted)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f{flex:none;border:0;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:700;min-height:38px}
.f[aria-pressed="true"]{background:var(--fg);color:var(--bg);box-shadow:none}
.rows>li{border-bottom:1px solid var(--line)}
.rows>li:last-child{border-bottom:0}
.row-btn{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:11px 0;text-align:left;min-height:60px}
.row-btn .nm,.row .nm{flex:1;font-weight:700;min-width:0;overflow-wrap:anywhere}
.rt{display:flex;align-items:center;gap:8px;flex:none}
.tm{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:60px}
.row>div:not(.acts){flex:1;min-width:0}
.code{font-family:var(--mono);font-size:12.5px;color:var(--muted);overflow-wrap:anywhere;font-weight:500}
.sub{display:block;font-weight:500}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:130px;font-weight:700}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.empty{align-items:flex-start}
.mrow{display:flex;flex-direction:column;gap:10px;padding:14px 0}
.gsteps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}

/* schedule form */
.daybox{display:inline-flex;align-items:center;gap:8px;margin:0;font-size:14px;font-weight:700;min-height:44px;padding:6px 14px;border-radius:999px;background:var(--surface-2);cursor:pointer}
.daybox input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.sdays{display:flex;flex-direction:column;gap:8px}
.sday{display:grid;grid-template-columns:92px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.sday .daybox{width:100%;padding-inline:12px}
.sday.hdr{padding-top:0}
.sday .mode{grid-column:2 / span 2;display:none;min-height:44px;padding:8px 12px;font-size:15px}
.sday:has(input[type=checkbox]:checked) .mode{display:block}
.solist{display:none;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:4px 12px 8px;margin-top:8px}
.fields:has(#f-sonly:checked) .solist{display:block}
.sorow{display:flex;align-items:center;gap:10px;min-height:40px;font-weight:600;font-size:14px;margin:0;cursor:pointer}
.sorow input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:none}
.sday .room{grid-column:2 / span 2;display:none;min-height:44px;padding:8px 12px;font-size:15px}
.sday:has(input[type=checkbox]:checked) .room{display:block}
.sday input[type=time]{padding:8px 6px;min-height:44px}
.sday:has(input[type=checkbox]:not(:checked)) input[type=time]{opacity:.45}
.fmts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fmt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;min-height:84px;border:0;border-radius:18px;background:var(--surface-2)}
.fmt strong{font-family:var(--body);font-weight:800;font-size:18px;letter-spacing:-.02em}
@media (max-width:340px){.fmts{grid-template-columns:1fr}}

/* camera */
#cam{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
#cam-v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-frame{position:absolute;left:50%;top:36%;width:min(68vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:28px;box-shadow:0 0 0 100vmax rgba(5,10,25,.55)}
.cam-frame i{position:absolute;width:40px;height:40px;border:5px solid #fff}
.cam-frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:28px}
.cam-frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:28px}
.cam-frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:28px}

function sortStudents(){S.students.sort(function(a,b){return a.n.localeCompare(b.n,'en',{sensitivity:'base'})})}
function cmpSess(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.created||0)-(b.created||0)}

function pickActive(){
  if(S.activeId&&S.sessions[S.activeId])return;

}
function setActive(id){S.activeId=id;ls.set(actKey(),id||'')}

  ls.set(secKey(S.curSec),JSON.stringify({students:S.students,section:S.section,schedules:S.schedules,sessions:S.sessions,gone:S.gone,hol:S.hol||[],priv:S.priv||{}}));

}
function loadLocal(){
  S.hol=[];S.priv={};
  try{
    var d=JSON.parse(ls.get(secKey(S.curSec))||'null');
    if(d){S.students=d.students||[];S.section=d.section||'';S.sessions=d.sessions||{};S.schedules=normSched(d.schedules||[]);S.gone=Array.isArray(d.gone)?d.gone:[];S.hol=holNorm(d.hol);S.priv=d.priv&&typeof d.priv==='object'?d.priv:{};}
  }catch(e){}

}
function persistRoster(){saveLocal();cfgPushSoon()}

function init(){
  S.gs=loadGs();

  if(S.gs.role&&S.gs.url&&S.gs.url!==SEC_URL){S.gs.url=SEC_URL;saveGs();gsSaveSent({});if(S.gs.role==='admin')ls.set('talaan-gscfg','');S.moved=true}
  var cs=ls.get('talaan-cursec')||'main';
  if(!secList().some(function(x){return x.id===cs}))cs=secList()[0].id;
  S.curSec=cs;S.activeId=ls.get(actKey());
  loadLocal();pickActive();
  try{initLock()}catch(e){console.warn(e)}
  if(needLogin()&&(stuSess()||/[?&#]student/.test(location.search+location.hash))){S.stuOn=true;stuLoad(true)}

}

/* ---------- domain ---------- */
function active(){return S.activeId?S.sessions[S.activeId]:null}
function stuBy(i){return S.students.find(function(s){return s.i===i})}
function recOf(ses,i){return ses.records.find(function(r){return r.i===i})}

function statusNow(ses){return statusFor(ses,new Date())}
function hhmm(d){return pad(d.getHours())+':'+pad(d.getMinutes())}
function timeOn(ses,v){var m=/^(\d{1,2}):(\d{2})/.exec(String(v||''));if(!m)return null;var p=parseDate(ses.date);return new Date(p.getFullYear(),p.getMonth(),p.getDate(),+m[1],+m[2])}
function defaultTime(ses,rec){if(rec&&rec.t&&rec.s!=='excused')return hhmm(new Date(rec.t));return ses.date===todayStr()?hhmm(new Date()):(ses.start||'07:30')}
function fieldIso(){var ses=active(),el=$('#f-tm');if(!ses||!el)return null;var d=timeOn(ses,el.value);return d?d.toISOString():null}
function setTimeIn(i,v){
  var ses=active();if(!ses)return null;
  var d=timeOn(ses,v);if(!d)return null;
  var ex=recOf(ses,i),rec={i:i,t:d.toISOString(),m:ex?ex.m:'manual',s:statusFor(ses,d)};
  if(ex&&ex.s!=='excused'&&ex.t&&Math.floor(new Date(ex.t).getTime()/60000)!==Math.floor(d.getTime()/60000))rec.ed=1;
  else if(ex&&ex.ed)rec.ed=1;
  ses.records=ex?ses.records.map(function(r){return r.i===i?rec:r}):ses.records.concat([rec]);
  persistSession(ses.id);return rec;
}
function findStudent(raw){
  var n=norm(raw);if(!n)return null;
  var withCode=S.students.filter(function(s){return s.c});
  var hit=withCode.find(function(s){return norm(s.c)===n});
  if(hit)return hit;
  return withCode.find(function(s){var c=norm(s.c);return c.length>=4&&n.indexOf(c)!==-1})||null;
}
function markIn(i,method){
  var ses=active();
  if(!ses){toast('Add a class first.');return null}
  if(ses.nc){toast('This meeting is marked No class.');return null}
  if(ses.closed&&method==='qr'){toast('This class has ended, so scanning is off. Tap Reopen class to continue.');return null}
  var ex=recOf(ses,i);if(ex)return {dup:true,rec:ex};
  var en=endAt(ses);if(en&&new Date()>en)toast('Note: this class has already ended.');
  var rec={i:i,t:new Date().toISOString(),m:method,s:statusNow(ses)};
  ses.records=ses.records.concat([rec]);persistSession(ses.id);
  return {rec:rec};
}
function withX(o,s,x){x=String(x||'').trim().slice(0,80);if(s==='excused'&&x)o.x=x;return o}
function setStatus(i,s,x,iso){
  var ses=active();if(!ses)return;
  var ex=recOf(ses,i);
  if(ex){
    ses.records=ses.records.map(function(r){if(r.i!==i)return r;var t=r.t;if(!t&&s!=='excused')t=iso||new Date().toISOString();var o={i:r.i,t:t,m:r.m,s:s};if(r.ed)o.ed=1;return withX(o,s,x)});
  }else{
    ses.records=ses.records.concat([withX({i:i,t:s==='excused'?null:(iso||new Date().toISOString()),m:'manual',s:s},s,x)]);
  }
  persistSession(ses.id);
}
function removeRec(i){
  var ses=active();if(!ses)return;
  ses.records=ses.records.filter(function(r){return r.i!==i});persistSession(ses.id);

  var names=new Set(S.students.map(function(s){return s.n.toLowerCase()}));

    n=n.replace(/\s+/g,' ').trim();

/* ---------- QR decoding ---------- */
async function loadBitmap(file){
  try{if(window.createImageBitmap)return await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){}
  var url=URL.createObjectURL(file);
  var img=new Image();img.src=url;
  try{await img.decode()}finally{setTimeout(function(){URL.revokeObjectURL(url)},5000)}
  return img;
}
async function decodeQR(file){
  var src=await loadBitmap(file);
  var w0=src.width||src.naturalWidth,h0=src.height||src.naturalHeight;
  if('BarcodeDetector' in window){
    try{var det=new window.BarcodeDetector({formats:['qr_code']});var r=await det.detect(src);if(r&&r[0]&&r[0].rawValue)return r[0].rawValue}catch(e){}
  }
  if(typeof window.jsQR!=='function')throw new Error('jsQR not loaded');
  var cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true});
  var seen={};
  var sizes=[1100,700,1600,450];
  for(var k=0;k<sizes.length;k++){
    var sc=Math.min(1,sizes[k]/Math.max(w0,h0));
    var w=Math.max(1,Math.round(w0*sc)),h=Math.max(1,Math.round(h0*sc));
    if(seen[w+'x'+h])continue;seen[w+'x'+h]=1;
    cv.width=w;cv.height=h;ctx.drawImage(src,0,0,w,h);
    var d=ctx.getImageData(0,0,w,h);
    var code=window.jsQR(d.data,w,h,{inversionAttempts:'attemptBoth'});
    if(code&&code.data)return code.data;
    await new Promise(function(res){setTimeout(res,0)});
  }
  return null;
}
async function scanFile(file,mode){
  return ldWrap('Reading the QR...',function(){return scanFile_(file,mode)},false);
}
async function scanFile_(file,mode){
  if(!file)return;
  if(mode==='scan'&&!active()){toast('Add a class first.');return}
  if(mode==='scan'&&active().closed){toast('This class has ended, so scanning is off. Tap Reopen class to continue.');return}
  S.busy=true;S.last=null;render();
  var raw=null;
  try{raw=await decodeQR(file)}catch(e){console.warn(e)}
  S.busy=false;
  if(mode==='reg'){
    if(raw){S.f['f-code']=raw;toast('QR read.')}else toast('Could not read the QR. Try again.');
    render();return;
  }
  if(!raw){S.last={kind:'fail'};render();return}
  var st=findStudent(raw);
  if(!st){S.last={kind:'new',raw:raw};S.f['f-newname']='';render();return}
  var r=markIn(st.i,'qr');
  S.last=r&&r.dup?{kind:'dup',i:st.i}:{kind:'ok',i:st.i};
  render();
}

 (e) {}\n  function row(a, b) {\n    return '<tr><td style=\"padding:11px 0;color:#7a8196;font-size:13px;border-bottom:1px solid #f1e8da\">' + a + '<\/td><td style=\"padding:11px 0;text-align:right;font-weight:700;font-size:14px;color:#1a1f36;border-bottom:1px solid #f1e8da\">' + b + '<\/td><\/tr>';\n  }\n  return '<div style=\"background:#f6ede0;padding:28px 12px;font-family:Arial,Helvetica,sans-serif\">'\n    + '<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" style=\"max-width:440px;margin:0 auto;background:#ffffff;border-radius:20px;overflow:hidden;border:1px solid #eadcc8\">'\n    + '<tr><td style=\"background:#7a1216;padding:20px 24px\"><table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\"><tr>'\n    + '<td style=\"vertical-align:middle\"><img src=\"cid:talaanlogo\" width=\"46\" height=\"46\" alt=\"TALAAN\" style=\"display:block;border-radius:12px;border:0\"><\/td>'\n    + '<td style=\"vertical-align:middle;padding-left:14px\"><div style=\"font-size:12px;letter-spacing:3px;color:#ffd98a;font-weight:700\">TALAAN<\/div><div style=\"font-size:20px;font-weight:700;color:#ffffff;margin-top:2px\">Attendance Receipt<\/div><\/td>'\n    + '<\/tr><\/table><\/td><\/tr>'\n    + '<tr><td style=\"padding:30px 24px 6px;text-align:center\">'\n    + '<table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" align=\"center\"><tr><td width=\"64\" height=\"64\" align=\"center\" valign=\"middle\" style=\"width:64px;height:64px;border-radius:32px;background:' + soft + ';border:3px solid ' + ring + ';font-size:30px;line-height:64px;color:' + col + ';font-weight:700\">&#10003;<\/td><\/tr><\/table>'\n    + '<div style=\"font-size:23px;font-weight:700;color:#1a1f36;margin-top:16px\">Marked ' + esc_(st) + '<\/div>'\n    + '<div style=\"font-size:14px;color:#6b7280;margin-top:6px;line-height:1.5\">Hi ' + esc_(first) + ', your attendance has been recorded.<\/div><\/td><\/tr>'\n    + '<tr><td style=\"padding:18px 24px 6px\"><div style=\"background:' + soft + ';border-radius:14px;padding:16px;text-align:center\">'\n    + '<div style=\"font-size:11px;letter-spacing:2px;color:#7a8196;font-weight:700\">TIME IN<\/div>'\n    + '<div style=\"font-size:32px;font-weight:800;color:' + col + ';margin-top:4px\">' + esc_(r[6]) + '<\/div>'\n    + '<div style=\"font-size:13px;color:#4b5266;margin-top:4px\">' + esc_(pretty) + '<\/div><\/div><\/td><\/tr>'\n    + '<tr><td style=\"padding:8px 24px 0\"><table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\">'\n    + row('Class', esc_(r[1])) + (section ? row('Section', esc_(section)) : '') + row('Student', esc_(r[3])) + (r[4] ? row('ID', esc_(r[4])) : '') + row('Status', esc_(st))\n    + '<\/table><\/td><\/tr>'\n    + '<tr><td style=\"padding:18px 24px 0\"><div style=\"border-top:2px dashed #e3d4bf\"><\/div><\/td><\/tr>'\n    + '<tr><td style=\"padding:16px 24px 22px;text-align:center\"><div style=\"font-size:11px;letter-spacing:2px;color:#7a8196;font-weight:700\">REFERENCE NO.<\/div>'\n    + '<div style=\"font-family:Courier New,monospace;font-size:17px;font-weight:700;color:#1a1f36;margin-top:4px;letter-spacing:1px\">' + esc_(ref) + '<\/div><\/td><\/tr>'\n    + (qrp_ ? '<tr><td style=\"padding:0 24px 22px;text-align:center\"><a href=\"' + esc_(vl_) + '\" style=\"text-decoration:none\"><img src=\"cid:talaanqr\" width=\"' + qrp_.px + '\" height=\"' + qrp_.px + '\" alt=\"Scan to verify\" style=\"display:block;margin:0 auto;border:0;max-width:100%;height:auto\"><\/a><div style=\"font-size:12px;color:#6b7280;margin-top:8px;line-height:1.5\">Scan with your phone camera to check that this receipt is recorded.<\/div><\/td><\/tr>' : '')\n    + '<tr><td style=\"background:#fbf5ea;padding:16px 24px;text-align:center;font-size:12px;color:#7a8196;line-height:1.6\">This is an automatic message from TALAAN.<br>If something is wrong, tell your teacher or class secretary and quote the reference number.<br>You can check this receipt in the TALAAN app under Verify receipt.<br><br>' + esc_(privLine_()) + '<\/td><\/tr>'\n    + '<\/table><\/div>';\n}\n\nfunction logMail_(ss, msg) {\n  try { logSheet_(ss).appendRow([Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd HH:mm:ss'), 'script', 'system', 'Email', msg]); } catch (x) {}\n}\n\n// Run this once from the editor (Run > testEmail). It asks for permission to send email and sends a sample receipt to you.\nfunction testEmail() {\n  var me = Session.getEffectiveUser().getEmail();\n  var r = [Utilities.formatDate(new Date(), Session.getScriptTimeZone(), 'yyyy-MM-dd'), 'Sample Class', '', 'Dela Cruz, Juan', '2025-00000', 'Present', '8:00 AM'];\n  MailApp.sendEmail({ to: me, subject: 'Talaan test receipt', body: 'This is a test receipt from Talaan.', htmlBody: receiptHtml_(r, ref_(r), 'Sample Section'), inlineImages: receiptImages_(ref_(r)), name: 'Talaan Attendance' });\n  Logger.log('Sent to ' + me + '. Emails left today: ' + MailApp.getRemainingDailyQuota());\n}\n\nfunction logSheet_(ss) {\n  var sh = ss.getSheetByName('Activity Log');\n  if (!sh) {\n    sh = ss.insertSheet('Activity Log');\n    sh.getRange(1, 1, 1, 5).setValues([['Time', 'User', 'Role', 'Action', 'Details']]).setFontWeight('bold');\n    sh.setFrozenRows(1);\n    sh.getRange('A:A').setNumberFormat('@');\n  }\n  return sh;\n}\n\nfunction norm_(s) { return String(s == null ? '' : s).trim().toLowerCase().replace(/\\s+/g, ''); }\n\nfunction roleOf_(data) {\n  if (SECRET && data.token === SECRET) return 'admin';\n  var pw = String(data.h == null ? '' : data.h);\n  if (!pw) return null;\n  var ap = P.getProperty('ADMIN_PASS'), sp = P.getProperty('SECRETARY_PASS');\n  if (ap && pw === String(ap).trim()) return 'admin';\n  if (sp && pw === String(sp).trim()) return 'secretary';\n  return null;\n}\n// A secretary can only ADD students and classes. Nothing already saved is changed or removed.\nfunction mergeCfg_(old, inc) {\n  old = old || {}; inc = inc || {};\n  var out = { section: old.section || inc.section || '', students: (old.students || []).slice(), schedules: (old.schedules || []).slice() };\n  var ids = {}, keys = {}, sid = {};\n  out.students.forEach(function (s) { ids[s.i] = 1; keys[norm_(s.c || s.n)] = 1; });\n  (inc.students || []).forEach(function (s) {\n    if (!s || !s.n) return;\n    var k = norm_(s.c || s.n);\n    if (ids[s.i] || keys[k]) return;\n    ids[s.i] = 1; keys[k] = 1;\n    out.students.push({ i: String(s.i), n: String(s.n), c: String(s.c || '') });\n  });\n  out.schedules.forEach(function (x) { sid[x.id] = 1; sid['s:' + norm_(x.subject)] = 1; });\n  (inc.schedules || []).forEach(function (x) {\n    if (!x || !x.subject || sid[x.id] || sid['s:' + norm_(x.subject)]) return;\n    sid[x.id] = 1; sid['s:' + norm_(x.subject)] = 1;\n    out.schedules.push(x);\n  });\n  return out;\n}\nfunction allowed_(user, subject) {\n  if (!user) return true;\n  var c = user.classes || [];\n  if (!c.length) return true;\n  return c.some(function (x) { return norm_(x) === norm_(subject); });\n}\nfunction cfg_() {\n  var n = Number(P.getProperty('CFG_N') || 0), s = '';\n  for (var i = 0; i < n; i++) s += P.getProperty('CFG_' + i) || '';\n  try { return s ? JSON.parse(s) : null; } catch (e) { return null; }\n}\nfunction setCfg_(str) {\n  var old = Number(P.getProperty('CFG_N') || 0), n = Math.ceil(str.length / 8000), o = {}, i;\n  for (i = 0; i < n; i++) o['CFG_' + i] = str.substr(i * 8000, 8000);\n  o.CFG_N = String(n);\n  P.setProperties(o);\n  for (i = n; i < old; i++) P.deleteProperty('CFG_' + i);\n}\nfunction sheet_(ss) {\n  var sh = ss.getSheetByName(TAB);\n  if (!sh) {\n    sh = ss.insertSheet(TAB);\n    sh.getRange(1, 1, 1, REASON_COL).setValues([HEAD.concat(['Reason'])]).setFontWeight('bold');\n    sh.setFrozenRows(1);\n    sh.getRange('A:A').setNumberFormat('@');\n    sh.getRange('G:G').setNumberFormat('@');\n    sh.hideColumns(11);\n  } else {\n    if (sh.getMaxColumns() < REASON_COL) sh.insertColumnsAfter(sh.getMaxColumns(), REASON_COL - sh.getMax  {\n    var p = 0, l = 0, e = 0, a = 0;\n    var cells = dates.map(function (d) {\n      var v = st[s.k + '|' + d];\n      if (v === 'Present') { p++; return 'P'; }\n      if (v === 'Late') { l++; return 'L'; }\n      if (v === 'Excused') { e++; return 'E'; }\n      a++; return 'A';\n    });\n    var den = p + l + a;\n    var rate = den ? Math.round((p + l) / den * 100) : '';\n    if (rate !== '') { sumRate += rate; nRate++; }\n    tp += p; tl += l; te += e; ta += a;\n    return [s.n, s.c].concat(cells, [p, l, e, a, rate]);\n  });\n  var head = ['Student', 'ID/QR'].concat(dates, ['Present', 'Late', 'Excused', 'Absent', 'Rate %']);\n  var w = head.length;\n  function pad(r) { while (r.length < w) r.push(''); return r; }\n  var values = [\n    pad([subject + (cfg.section ? ' - ' + cfg.section : '')]),\n    pad(['Sessions held: ' + dates.length, 'Class list: ' + stu.length + ' students']),\n    pad(['P = Present, L = Late, E = Excused, A = Absent']),\n    head\n  ].concat(body.map(pad));\n  return {\n    values: values, ncols: 2 + dates.length,\n    sum: [subject, dates.length, stu.length, tp, tl, te, ta, nRate ? Math.round(sumRate / nRate) : '']\n  };\n}\n\nfunction writeTab_(ss, name, values, textCols) {\n  var sh = ss.getSheetByName(name) || ss.insertSheet(name);\n  sh.clear();\n  var h = values.length, w = values[0].length;\n  if (textCols) sh.getRange(1, 1, h, textCols).setNumberFormat('@');\n  sh.getRange(1, 1, h, w).setValues(values);\n  sh.getRange(1, 1).setFontWeight('bold').setFontSize(13);\n  return sh;\n}\n\nfunction rebuild_(ss, only) {\n  var rows = allRows_(ss), cfg = cfg_() || {}, by = {}, names = {};\n  rows.forEach(function (r) {\n    var k = norm_(r[1]);\n    if (!k) return;\n    (by[k] = by[k] || []).push(r);\n    names[k] = r[1];\n  });\n  (cfg.schedules || []).forEach(function (s) {\n    var k = norm_(s.subject);\n    names[k] = names[k] || s.subject;\n    by[k] = by[k] || [];\n  });\n  var summary = [['Class', 'Sessions held', 'Students', 'Present', 'Late', 'Excused', 'Absent', 'Avg rate %']];\n  Object.keys(names).forEach(function (k) {\n    var t = buildClass_(names[k], by[k], cfg);\n    summary.push(t.sum);\n    if (!only || only.indexOf(k) > -1) {\n      var sh = writeTab_(ss, 'Class - ' + safeName_(names[k]), t.values, t.ncols);\n      sh.getRange(4, 1, 1, t.values[3].length).setFontWeight('bold');\n      sh.setFrozenRows(4);\n      sh.setFrozenColumns(1);\n    }\n  });\n  var sm = writeTab_(ss, 'Summary', summary, 1);\n  sm.getRange(1, 1, 1, 8).setFontWeight('bold');\n  sm.setFrozenRows(1);\n}\n\nfunction json_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n\n// ===== TALAAN Student portal (v6.6) =====\n// Students sign in with the email saved on their student page plus a 6-digit code sent to that email.\n// Excuse letters are saved in the \"Excuses\" tab. Letter pictures go to the Drive folder \"TALAAN Excuse Letters\" (private).\n// Optional Script property EXCUSE_NOTIFY = email1,email2 : extra people who get an email for every new excuse letter (the script owner always does).\n// Needs the doPost hook:  if (pre_ && /^(stu|exc)/.test(String(pre_.action || ''))) { return portal_(pre_); }\nvar EXC_TAB = 'Excuses', EXC_HEAD = ['ID', 'Sent', 'Date', 'Subject', 'Student', 'ID/QR', 'Email', 'Reason', 'File', 'Status', 'Reviewed by', 'Reviewed', 'Note'];\n\nfunction stuKey_() { var k = P.getProperty('STU_KEY'); if (!k) { k = Utilities.getUuid() + Utilities.getUuid(); P.setProperty('STU_KEY', k); } return k; }\nfunction stuSign_(v) { return Utilities.base64EncodeWebSafe(Utilities.computeHmacSha256Signature(String(v), stuKey_())); }\nfunction stuFind_(email) {\n  email = String(email || '').trim().toLowerCase(); if (!email) return null;\n  var c = cfg_() || {}, s = (c.students || []).filter(function (x) { return x && x.e && String(x.e).trim().toLowerCase() === email; })[0];\n  return s ? { s: s, cfg: c } : null;\n}\nfunction stuAuth_(d) {\n  var t = String(d.tok || '').split('~'); if (t.length !== 2) return null;\n  var p; try { p = Utilities.newBlob(Utilities.base64DecodeWebSafe(t[0])).getDataAsString(); } catch (e) { return null; }\n  if (stuSign_(p) !== t[1]) return null;\n  var q = p.split('|'); if (Number(q[1]) < Date.now()) return null;\n  return stuFind_(q[0]);\n}\nfunction stuCode_(d) {\n  var em = String(d.email || '').trim().toLowerCase(), f = stuFind_(em), cache = CacheService.getScriptCache();\n  if (f) {\n    if (cache.get('sw_' + em)) return { ok: false, error: 'wait' };\n    if (MailApp.getRemainingDailyQuota() < 1) return { ok: false, error: 'quota' };\n    var code = ('000000' + Math.floor(Math.random() * 1e6)).slice(-6);\n    cache.put('sc_' + em, stuSign_(em + code), 600); cache.put('sw_' + em, '1', 60); cache.remove('st_' + em);\n    MailApp.sendEmail({ to: em, subject: 'Your TALAAN code: ' + code, body: 'Your TALAAN sign-in code is ' + code + '. It works for 10 minutes. If you did not ask for it, ignore this email.', name: 'Talaan Attendance' });\n  }\n  return { ok: true }; // same answer whether or not the email is on the list\n}\nfunction stuLogin_(d) {\n  var em = String(d.email || '').trim().toLowerCase(), f = stuFind_(em), cache = CacheService.getScriptCache();\n  var tries = Number(cache.get('st_' + em) || 0);\n  if (tries >= 5) return { ok: false, error: 'locked' };\n  var want = cache.get('sc_' + em);\n  if (!f || !want || want !== stuSign_(em + String(d.code || '').trim())) { cache.put('st_' + em, String(tries + 1), 600); return { ok: false, error: 'code' }; }\n  cache.remove('sc_' + em);\n  var p = em + '|' + (Date.now() + 30 * 864e5);\n  return { ok: true, tok: Utilities.base64EncodeWebSafe(p) + '~' + stuSign_(p), name: f.s.n };\n}\nfunction excSheet_(ss) {\n  var sh = ss.getSheetByName(EXC_TAB);\n  if (!sh) {\n    sh = ss.insertSheet(EXC_TAB);\n    sh.getRange(1, 1, 1, EXC_HEAD.length).setValues([EXC_HEAD]).setFontWeight('bold'); sh.setFrozenRows(1);\n    sh.getRange('B:C').setNumberFormat('@'); sh.getRange('L:L').setNumberFormat('@'); sh.hideColumns(9);\n  }\n  return sh;\n}\nfunction excRows_(ss) { var sh = excSheet_(ss), n = sh.getLastRow(); return n < 2 ? [] : sh.getRange(2, 1, n - 1, EXC_HEAD.length).getValues().map(function (r) { return r.map(cell_); }); }\nfunction excObj_(r) { return { id: r[0], sent: r[1], date: r[2], subj: r[3], name: r[4], code: r[5], reason: r[7], img: !!r[8], st: r[9], by: r[10], at: r[11], note: r[12] }; }\n\nfunction stuData_(d, ss) {\n  var f = stuAuth_(d); if (!f) return { ok: false, error: 'auth' };\n  var s = f.s, c = f.cfg, code = norm_(s.c), nm = norm_(s.n), em = norm_(s.e);\n  var rows = allRows_(ss).filter(function (r) { return (code && norm_(r[4]) === code) || norm_(r[3]) === nm; })\n    .map(function (r) { return [r[0], r[1], r[5], r[6], r[8], r[9], r[11]]; });\n  var sch = (c.schedules || []).filter(function (x) { return !Array.isArray(x.only) || x.only.indexOf(s.i) > -1; });\n  var exc = excRows_(ss).filter(function (r) { return norm_(r[6]) === em; }).reverse().slice(0, 60).map(excObj_);\n  return { ok: true, me: { n: s.n, c: s.c || '', e: s.e }, section: c.section || '', sch: sch, hol: c.hol || [], rows: rows, exc: exc, ann: annList_().map(function (a) { return { id: a.id, t: a.t, x: a.x }; }), lim: Number(P.getProperty('STU_LIM') || 0) };\n}\nfunction stuExc_(d, ss) {\n  var f = stuAuth_(d); if (!f) return { ok: false, error: 'auth' };\n  var s = f.s, subj = String(d.subject || ''), date = String(d.date || ''), why = String(d.reason || '').trim().slice(0, 500);\n  if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(date) || why.length < 5) return { ok: false, error: 'form' };\n  var okc = (f.cfg.schedules || []).some(function (x) { return norm_(x.subject) === norm_(subj) && (!Array.isArray(x.only) || x.only.indexOf(s.i) > -1); });\n  if (!okc) return { ok: false, error: 'class' };\n  var sh = excSheet_(ss);\n  if (excRows_(ss).some(function (r) { return norm_(r[6]) === norm_(s.e) && r[2] === date && nor function mergeCfgAdds(cfg){
  var ch=0,ids={},codes={},names={},have={};
  S.students.forEach(function(s){ids[s.i]=1;if(s.c)codes[norm(s.c)]=1;names[norm(s.n)]=1});
  (cfg.students||[]).forEach(function(s){
    if(!s||!s.n||ids[s.i]||(s.c&&codes[norm(s.c)])||(!s.c&&names[norm(s.n)]))return;
    S.students.push({i:s.i,n:s.n,c:s.c||'',e:s.e||''});ids[s.i]=1;if(s.c)codes[norm(s.c)]=1;names[norm(s.n)]=1;ch++;
  });
  S.schedules.forEach(function(x){have[x.id]=1;have[norm(x.subject)]=1});
  var add=(cfg.schedules||[]).filter(function(x){return x&&x.subject&&!have[x.id]&&!have[norm(x.subject)]&&S.gone.indexOf(norm(x.subject))===-1});
  if(add.length){S.schedules=S.schedules.concat(normSched(add));ch+=add.length}

}
function applyCfg(cfg){

  S.section=cfg.section||'';

}
function parse12(t){
  var m=/(\d{1,2}):(\d{2})\s*([ap])/i.exec(String(t||''));if(!m)return '';
  var H=parseInt(m[1],10)%12;if(/p/i.test(m[3]))H+=12;return pad(H)+':'+m[2];
}
function isoFrom(date,t,fallback){
  var hm=parse12(t)||fallback||'12:00',d=String(date).split('-').map(Number),p=hm.split(':').map(Number);
  return new Date(d[0],d[1]-1,d[2],p[0],p[1]||0).toISOString();
}
function mergeRows(rows){
  var ch=0;
  rows.forEach(function(r){
    var date=String(r[0]||''),subj=String(r[1]||''),code=r[4],name=r[3],st=r[5];
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!subj)return;
    if(S.gone.indexOf(norm(subj))>-1||S.gone.indexOf(date+'|'+norm(subj))>-1)return;
    var sch=S.schedules.find(function(x){return norm(x.subject)===norm(subj)});
    if(isSec()&&!sch)return;
    var ses=null;
    Object.keys(S.sessions).forEach(function(k){var s=S.sessions[k];if(!ses&&s.date===date&&norm(s.subject)===norm(subj))ses=s});
    if(!ses){
      var id=uid('s');
      ses=S.sessions[id]={id:id,date:date,subject:subj,start:parse12(r[8])||(sch&&sch.slots[0].start)||'07:30',end:parse12(r[9])||'',grace:sch?sch.grace:10,created:Date.now(),sch:sch?sch.id:'',records:[]};
      ch++;
    }
    if(st==='No class'){if(!ses.nc){ses.nc=1;ch++}var nr0=r[11]?String(r[11]).slice(0,80):'';if(nr0!==(ses.ncr||'')){ses.ncr=nr0;ch++}return}
    if(ses.nc&&isSec()){delete ses.nc;delete ses.ncr;ch++}
    if(!st||st==='Absent')return;
    var stu=S.students.find(function(s){return (code&&s.c&&norm(s.c)===norm(code))||norm(s.n)===norm(name)});
    if(!stu)return;
    var have=recOf(ses,stu.i),why=st==='Excused'&&r[11]?String(r[11]).slice(0,80):'';
    if(have){if(have.s==='excused'&&!have.x&&why){have.x=why;ch++}return}
    var nr={i:stu.i,t:st==='Excused'?null:isoFrom(date,r[6],ses.start),m:r[7]==='QR'?'qr':'manual',s:st==='Late'?'late':st==='Excused'?'excused':'present'};
    if(why)nr.x=why;
    ses.records.push(nr);ch++;
  });
  return ch;
}
var gsPullAt=0;
async function gsPull(silent){
  if(!S.gs||!S.gs.url||!inSyncSec()||navigator.onLine===false)return;
  SYNC.pulling=true;paintSync();
  try{return await ldWrap(silent?'Syncing...':'Syncing with Google Sheets...',function(){return gsPull_(silent)},!!silent)}
  finally{SYNC.pulling=false;paintSync()}
}
async function gsPull_(silent){
  if(!S.gs||!S.gs.url||!inSyncSec()||navigator.onLine===false)return;
  if(silent&&Date.now()-gsPullAt<15000)return;
  gsPullAt=Date.now();logFlush();
  if((S.students.length||S.schedules.length)&&ls.get('talaan-gscfg')!==cfgHash()){try{await cfgPush_(false)}catch(e){}}
  var res;
  try{res=await gsRead({action:'pull'})}catch(e){SYNC.net=true;if(!silent)toast('Could not read from Google Sheets. Check your internet.');return}
  SYNC.net=false;
  if(!res||res.ok===false){
    if(!silent)toast(res&&res.error==='auth'?'Your name or password is no longer valid. Sign out and sign in again.':'Sync failed. Make sure the newest script is deployed.');
    return;
  }
  SYNC.last=Date.now();ls.set('talaan-gslast',String(SYNC.last));
  var ch=0;
  if(res.cfg){
    var clean=ls.get('talaan-gscfg')===cfgHash();
    if(isSec()||clean||(!S.students.length&&!S.schedules.length))ch+=applyCfg(res.cfg);
    else ch+=mergeCfgAdds(res.cfg);
    if(clean||isSec()||!S.students.length)ls.set('talaan-gscfg',cfgHash());
  }
  ch+=mergeRows(res.rows||[]);
  if(ch){saveLocal();pickActive();render()}
  if(!silent)toast(ch?'Synced with Google Sheets.':'Already up to date.');
}

function verifyUrl(){return (S.gs&&S.gs.url)||SEC_URL}
async function doVerify(){
  var raw=String(S.f['f-vref']||'').trim();
  if(!raw){S.vres={k:'err',m:'Type the reference number from the receipt.'};render();return}
  if(navigator.onLine===false){S.vres={k:'err',m:'You are offline. Connect to the internet to check a receipt.'};render();return}
  S.vres={k:'busy'};render();
  var res;
  try{var r=await fetch(verifyUrl(),{method:'POST',headers:GSH,body:JSON.stringify({action:'verify',ref:raw})});res=await r.json()}
  catch(e){S.vres={k:'err',m:'Could not reach the server. Check your internet and try again.'};render();return}
  if(res&&res.ok&&res.found)S.vres={k:'ok',r:res};
  else if(res&&res.ok)S.vres={k:'none'};
  else if(res&&res.error==='format')S.vres={k:'err',m:'That does not look like a reference number. It looks like TLN-20261118-1A2B3C4D.'};
  else if(res&&res.error==='busy')S.vres={k:'err',m:'Too many wrong tries. Please wait a few minutes and try again.'};
  else S.vres={k:'err',m:'Could not check right now. The admin may need to update the script to the newest version.'};
  render();
  setTimeout(function(){var e=document.getElementById('ver-res');if(e)e.scrollIntoView({block:'nearest',behavior:'smooth'})},40);
}

/* column widths (mm) sized to the content, so Student and ID stay snug and the date columns stay narrow */
function colMm(ex,usable){
  var n=ex.head.length,w=[],nd=0;
  for(var i=0;i<n;i++){
    var d=ex.wide&&i>=2&&i<=n-6,u=ex.wide&&i>n-6;
    if(d){w.push(7);nd++;continue}
    var m=String(ex.head[i]).length;
    ex.rows.forEach(function(r){m=Math.max(m,String(r[i]==null?'':r[i]).length)});
    w.push(u?Math.max(13,m*1.5+7):Math.min(60,Math.max(14,m*1.55+8)));
  }
  var sum=w.reduce(function(a,b){return a+b},0);
  if(sum>usable&&nd){var cut=Math.min(2,(sum-usable)/nd);w=w.map(function(x,i){return ex.wide&&i>=2&&i<=n-6?x-cut:x});sum=w.reduce(function(a,b){return a+b},0)}
  if(sum>usable){var f=usable/sum;w=w.map(function(x){return x*f})}
  return w;
}
function printReport(ex){
  var n=ex.head.length,cw=colMm(ex,ex.wide?255:186),land=!!ex.wide;
  if(ex.wide){var c0=colMm(ex,1e9);if(c0.reduce(function(a,b){return a+b},0)<=186.5){cw=c0;land=false}}
  function isDate(i){return ex.wide&&i>=2&&i<=n-6}
  function isNum(i){return ex.wide&&i>n-6}
  var th=ex.head.map(function(h,i){return isDate(i)?'<th class="rot"><span>'+esc(h)+'</span></th>':'<th'+(isNum(i)?' class="n"':'')+'>'+esc(h)+'</th>'}).join('');
  var tr=ex.rows.map(function(r){return '<tr>'+r.map(function(v,i){var t=String(v==null?'':v);return '<td'+(isDate(i)&&t?' class="c'+esc(t)+'"':isNum(i)?' class="n"':'')+'>'+esc(t)+'</td>'}).join('')+'</tr>'}).join('');
  var st=document.getElementById('print-page');
  if(!st){st=document.createElement('style');st.id='print-page';document.head.appendChild(st)}
  st.textContent='@page{size:'+(land?'landscape':'portrait')+';margin:12mm}';
  $('#print').innerHTML='<h1>'+esc(ex.title)+'</h1>'+ex.meta.map(function(m){return '<p>'+esc(m)+'</p>'}).join('')
    +'<table class="pt" style="table-layout:fixed;width:'+cw.reduce(function(x,y){return x+y},0).toFixed(1)+'mm"><colgroup>'+cw.map(function(x){return '<col style="width:'+x.toFixed(1)+'mm">'}).join('')+'</colgroup><thead><tr>'+th+'</tr></thead><tbody>'+tr+'</tbody></table>'+sigHTML(ex.sigs)+'<p class="foot">Generated by TALAAN on '+esc(fmtDate(todayStr()))+'</p>';
  var old=document.title;document.title=ex.base;
  var imgs=[].slice.call(document.querySelectorAll('#print img')),fired=false;
  function go(){if(fired)return;fired=true;window.print();setTimeout(function(){document.title=old},1500)}
  if(!imgs.length)return go();
  Promise.all(imgs.map(function(im){return im.decode?im.decode().catch(function(){}):Promise.resolve()})).then(function(){setTimeout(go,200)});
  setTimeout(go,2500);
}
function doExport_(id,fmt){

function csvEsc(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}

function summaryText(ses){

function monthSpan(m,n){
  var p=String(m||'').split('-'),y=parseInt(p[0],10),mo=parseInt(p[1],10);
  if(!y||!mo)return ['',''];
  var last=new Date(y,mo-1+n,0);

function toast(m,undo){

  if(undo){
    el.textContent=m;
    var b=document.createElement('button');b.type='button';b.className='undo';b.dataset.act='undo';b.textContent='Undo';el.appendChild(b);
  }else el.textContent=m;
  el.classList.toggle('act',!!undo);el.classList.add('show');clearTimeout(tt);
  tt=setTimeout(function(){el.classList.remove('show','act');UNDO=null},undo?7000:2800);
}
function snap(){

  return JSON.stringify({students:S.students,schedules:S.schedules,sessions:S.sessions,section:S.section,activeId:S.activeId,gone:S.gone,cur:S.curSec,secs:secList(),raw:raw,sync:ls.get('talaan-syncsec')||''});
}
function restoreSnap(j){
  var d=JSON.parse(j);
  if(d.secs&&d.raw){
    secList().forEach(function(x){if(!d.secs.some(function(y){return y.id===x.id})){ls.set(secKey(x.id),'')}});
    Object.keys(d.raw).forEach(function(id){if(id!==d.cur)ls.set(secKey(id),d.raw[id])});
    saveSecs(d.secs);S.curSec=d.cur;ls.set('talaan-cursec',d.cur);ls.set('talaan-syncsec',d.sync||'');
  }
  S.students=d.students;S.schedules=d.schedules;S.sessions=d.sessions;S.section=d.section;S.activeId=d.activeId;S.gone=d.gone||[];
  ls.set(actKey(),S.activeId||'');sortStudents();pickActive();persistRoster();

function actUser(){return (S.gs&&(S.gs.name||S.gs.u))||'This device'}
function actLog(){try{return JSON.parse(ls.get('talaan-actlog')||'[]')}catch(e){return []}}
function actQ(){try{return JSON.parse(ls.get('talaan-actq')||'[]')}catch(e){return []}}
var logT=null;
function logAct(a,d){
  try{
    var e={t:new Date().toISOString(),u:actUser(),a:String(a).slice(0,60),d:String(d||'').slice(0,160)};
    var L=actLog();L.push(e);ls.set('talaan-actlog',JSON.stringify(L.slice(-200)));
    var q=actQ();q.push(e);ls.set('talaan-actq',JSON.stringify(q.slice(-500)));
    clearTimeout(logT);logT=setTimeout(logFlush,2500);
  }catch(err){}
}
async function logFlush(){
  if(!S.gs||!S.gs.url||navigator.onLine===false)return;
  var q=actQ();if(!q.length)return;
  var n=Math.min(q.length,100);
  try{var r=await gsRead({action:'log',entries:q.slice(0,n)});
    if(r&&r.ok)ls.set('talaan-actq',JSON.stringify(actQ().slice(n)))}catch(e){}
}
function actDetail(){
  try{var d=(CURACT&&CURACT.d)||{};

    if(d.id){var sc=S.schedules.find(function(x){return x.id===d.id});if(sc)return sc.subject;var se=S.sessions[d.id];if(se)return se.subject+' '+se.date}
  }catch(e){}
  return '';
}
function logPull(force){
  if(!S.gs||!S.gs.url||S.logLoading)return;
  S.logLoading=1;
  gsRead({action:'getLog'}).then(function(r){
    S.logLoading=0;S.logAt=Date.now();
    if(r&&r.ok){S.logRows=r.rows||[];S.logErr=''}else S.logErr='Could not load the shared log. Update your Apps Script.';
    render();
  }).catch(function(){S.logLoading=0;S.logAt=Date.now();S.logErr='No internet. Showing this phone only.';render()});
}
function logCard(){
  var shared=!!(S.gs&&S.gs.url)&&!S.logLocal;

  var rows,note;

    rows=actQ().slice().reverse().map(function(e){return {t:'waiting to send',u:e.u,a:e.a,d:e.d}}).concat(S.logRows.map(function(r){return {t:r[0],u:r[1],a:r[3],d:r[4]}}));
    note='Shared log from the Google Sheet: changes by the admin and the secretary (latest 100).';
  }else{

  }

function holNorm(a){
  var re=/^\d{4}-\d{2}-\d{2}$/;
  return (Array.isArray(a)?a:[]).map(function(h){
    if(!h||!re.test(h.d))return null;
    return {id:String(h.id||uid('h')),d:h.d,e:re.test(h.e||'')&&h.e>h.d?h.e:'',n:String(h.n||'').slice(0,60),c:String(h.c||'')};
  }).filter(Boolean).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:(a.n<b.n?-1:1)});
}
function holAny(date){return (S.hol||[]).find(function(h){return date>=h.d&&date<=(h.e||h.d)})||null}
function holOn(date,subject){return (S.hol||[]).find(function(h){return date>=h.d&&date<=(h.e||h.d)&&(!h.c||norm(h.c)===norm(subject))})||null}
/* classes that meet on a holiday (today and the last 7 days) and have no meeting yet are marked No class by themselves */
function holApply(){
  if(!(S.hol||[]).length||!S.schedules.length)return 0;
  var d0=parseDate(todayStr()),n=0,names={},k;
  for(k=0;k<=7;k++){
    var dd=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()-k),ds=dd.getFullYear()+'-'+pad(dd.getMonth()+1)+'-'+pad(dd.getDate());
    ncAffected(ds).forEach(function(x){
      var h=holOn(ds,x.sc.subject);
      if(!h||x.ses||S.gone.indexOf(ds+'|'+norm(x.sc.subject))>-1)return;
      var sid=uid('s'),sl=slotOf(x.sc,parseDate(ds).getDay())||x.sc.slots[0];
      S.sessions[sid]={id:sid,date:ds,subject:x.sc.subject,start:sl.start,end:sl.end||'',grace:x.sc.grace,created:Date.now(),sch:x.sc.id,records:[],keep:true,nc:1,ncr:h.n.slice(0,80)};
      persistSession(sid);n++;names[h.n]=1;
    });
  }
  if(n){logAct('No class (holiday)',Object.keys(names).join('; '));toast(n+' class'+(n===1?'':'es')+' marked No class: '+Object.keys(names).join('; ')+'.')}
  return n;
}
function holBanner(){
  var h=holAny(todayStr());if(!h)return '';

}

}
function phHolidays(y){
  function p(m,d){return y+'-'+pad(m)+'-'+pad(d)}
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  var mo=Math.floor((h+l-7*m+114)/31),dy=((h+l-7*m+114)%31)+1,easter=new Date(y,mo-1,dy);
  function off(n){var t=new Date(y,easter.getMonth(),easter.getDate()+n);return y+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())}
  var lm=new Date(y,7,31);while(lm.getDay()!==1)lm.setDate(lm.getDate()-1);
  return [{d:p(1,1),n:'New Year\'s Day'},{d:off(-3),n:'Maundy Thursday'},{d:off(-2),n:'Good Friday'},{d:off(-1),n:'Black Saturday'},{d:p(4,9),n:'Araw ng Kagitingan'},{d:p(5,1),n:'Labor Day'},{d:p(6,12),n:'Independence Day'},{d:p(8,21),n:'Ninoy Aquino Day'},{d:p(8,lm.getDate()),n:'National Heroes Day'},{d:p(11,1),n:'All Saints\' Day'},{d:p(11,30),n:'Bonifacio Day'},{d:p(12,8),n:'Feast of the Immaculate Conception'},{d:p(12,25),n:'Christmas Day'},{d:p(12,30),n:'Rizal Day'}];
}

/* auto-end: when today's class passes its end time, scanning stops and a summary shows */
function autoClass(){
  if(!S.schedules.length||S.sheet||S.selMode||CAM.kiosk)return;
  var now=new Date(),td=todayStr(),dow=now.getDay(),best=null;
  S.schedules.forEach(function(sc){
    var sl=slotOf(sc,dow);if(!sl||!sl.start)return;
    var st=timeOn({date:td},sl.start);if(!st)return;
    var en=sl.end?timeOn({date:td},sl.end):new Date(st.getTime()+90*60000);
    if(!en||now<new Date(st.getTime()-15*60000)||now>en)return;
    if(!best||st>best.st)best={sc:sc,sl:sl,st:st};
  });
  if(!best)return;
  var key=td+'|'+best.sc.id+'|'+best.sl.start;
  if(ls.get('talaan-autokey')===key)return;
  ls.set('talaan-autokey',key);
  var ex=sortedSessions('desc').find(function(s){return s.sch===best.sc.id&&s.date===td}),sid;
  if(ex)sid=ex.id;
  else{
    sid=uid('s');goneDrop(td+'|'+norm(best.sc.subject));
    S.sessions[sid]={id:sid,date:td,subject:best.sc.subject,start:best.sl.start,end:best.sl.end||'',grace:best.sc.grace,created:Date.now(),sch:best.sc.id,records:[]};
    persistSession(sid);
  }
  if(S.activeId===sid){return}
  setActive(sid);S.last=null;render();toast('Now showing: '+best.sc.subject);
}
function checkEnd(){
  var ses=active();

  ses.closed=true;persistSession(ses.id);

/* edit meeting */
function editChangeCount(ses,start,end,grace){
  var tmp={date:ses.date,start:start,end:end,grace:grace},n=0;
  ses.records.forEach(function(r){if(r.s==='excused'||!r.t)return;if(statusFor(tmp,new Date(r.t))!==r.s)n++});
  return n;
}
function editPreview(ses,start,end,grace){
  if(!start||!end||end<=start)return '';
  var n=editChangeCount(ses,start,end,isNaN(grace)?0:grace);
  return n?n+' time-in'+(n>1?'s':'')+' will change between Present and Late.':'No time-in will change status.';
}
function applyEdit(ses,start,end,grace){
  ses.start=start;ses.end=end;ses.grace=grace;
  ses.records=ses.records.map(function(r){
    if(r.s==='excused'||!r.t)return r;
    var ns=statusFor(ses,new Date(r.t));
    if(ns===r.s)return r;
    var o={};for(var k in r)o[k]=r[k];o.s=ns;return o;
  });
  var en=endAt(ses);if(en&&en>new Date())ses.closed=false;
  persistSession(ses.id);
}
function t2m(t){var a=String(t||'').split(':').map(Number);return (a[0]||0)*60+(a[1]||0)}
function m2t(m){m=Math.max(0,Math.min(1439,m));return pad(Math.floor(m/60))+':'+pad(m%60)}
function lateEnd(ses,st,shift){
  if(!ses.end)return '';
  if(!shift||!st)return ses.end;
  return m2t(t2m(st)+Math.max(t2m(ses.end)-t2m(ses.start),0));
}
function doLateStart(){
  var sh=S.sheet,ses=sh&&S.sessions[sh.id];if(!ses)return;
  var st=fv('f-ls-start',ses.start),shf=fv('f-ls-shift',true),en=lateEnd(ses,st,shf);
  if(!st){S.err='Pick the new start time.';renderSheet();return}
  if(en&&en<=st){S.err='The end time must be after the new start. Turn on "Move the end time too".';renderSheet();return}
  var n=editChangeCount(ses,st,en,ses.grace);
  withUndo('Class starts at '+fmt12(st)+(n?' \u00b7 '+n+' status'+(n>1?'es':'')+' changed':'')+'.',function(){applyEdit(ses,st,en,ses.grace)});
  ['f-ls-start','f-ls-shift'].forEach(function(k){delete S.f[k]});
  S.err='';S.sheet=null;renderSheet();render();
}
function doEditSess(){
  var sh=S.sheet,ses=sh&&S.sessions[sh.id];if(!ses)return;
  var st=fv('f-es-start',ses.start),en=fv('f-es-end',ses.end||''),gr=parseInt(fv('f-es-grace',ses.grace),10);
  if(!st||!en){S.err='Fill in the start and end time.';renderSheet();return}
  if(en<=st){S.err='End time must be after the start time.';renderSheet();return}
  gr=isNaN(gr)?10:Math.max(0,Math.min(120,gr));
  var n=editChangeCount(ses,st,en,gr);

  ['f-es-start','f-es-end','f-es-grace'].forEach(function(k){delete S.f[k]});
  S.err='';S.sheet=null;renderSheet();render();
}

function tmin(h){var p=String(h||'0:0').split(':');return (+p[0]||0)*60+(+p[1]||0)}

  var out=[];

    var a=tmin(q.start),b=q.end?tmin(q.end):a+60;
    out.push({sub:x.subject,d:q.d,a:a,b:b,s:q.start,e:q.end||'',m:modeLbl(q),r:q.room||'',pf:x.prof||'',c:[]});

  return out;

/* PIN lock */
var LK={on:false,mode:'lock',view:'pad',buf:'',busy:false,msg:'',err:false,cover:false,hiddenAt:0};
function pinCfg(){try{return JSON.parse(ls.get('talaan-pin')||'null')}catch(e){return null}}
function hasPin(){var c=pinCfg();return !!(c&&c.h)}
async function pinHash(pin,salt){
  try{
    if(window.crypto&&crypto.subtle){
      var enc=new TextEncoder(),key=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);
      var bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(salt),iterations:100000},key,256);
      return 'p'+Array.from(new Uint8Array(bits)).map(function(b){return ('0'+b.toString(16)).slice(-2)}).join('');
    }
  }catch(e){}
  var h=5381,s=salt+':'+pin;
  for(var r=0;r<2000;r++){for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0}
  return 'f'+(h>>>0).toString(16);
}
async function verifyPin(pin){var c=pinCfg();if(!c)return false;return (await pinHash(String(pin),c.s))===c.h}
function lockoutInfo(){try{var o=JSON.parse(ls.get('talaan-pinfail')||'{}')||{};return {fails:o.f||0,until:o.u||0}}catch(e){return {fails:0,until:0}}}
function setLockout(f,u){ls.set('talaan-pinfail',JSON.stringify({f:f,u:u}))}
function lockHTML(view){
  var logo=mascot(96,'mas-idle');
  if(view==='cover')return '<div class="lock-in">'+logo+'<h1 class="login-t">TALAAN</h1></div>';
  if(view==='forgot')return '<div class="lock-in"><h2 class="h2">Forgot your PIN?</h2><p class="muted">A PIN cannot be recovered. The only way back in is to delete all data on this phone and start again. Your Google Sheet and any backup file you saved are not touched.</p><div class="acts" style="justify-content:center"><button class="btn bad" data-act="pinreset">Delete data and reset</button><button class="btn" data-act="pinback">Back</button></div></div>';
  var c=pinCfg(),n=c?c.n:4,dots='',keys='',i;
  for(i=0;i<n;i++)dots+='<i'+(i<LK.buf.length?' class="on"':'')+'></i>';
  for(i=1;i<=9;i++)keys+='<button class="pk" type="button" data-act="pk" data-k="'+i+'">'+i+'</button>';
  keys+='<span></span><button class="pk" type="button" data-act="pk" data-k="0">0</button><button class="pk x" type="button" data-act="pk" data-k="del" aria-label="Delete">&#9003;</button>';
  return '<div class="lock-in">'+logo+'<h1 class="login-t" style="font-size:24px">TALAAN</h1><p class="'+(LK.err?'err':'muted')+'">'+esc(LK.msg)+'</p><div class="dots" aria-label="PIN entry">'+dots+'</div><div class="pad">'+keys+'</div>'+(LK.mode==='kiosk'?'<button class="link" data-act="lockback">Back to scanning</button>':'')+'<button class="link" data-act="pinforgot">Forgot PIN?</button></div>';
}
function paintLock(view){
  var el=document.getElementById('lock');if(!el)return;
  if(!view){el.hidden=true;el.innerHTML='';return}
  el.hidden=false;el.innerHTML=lockHTML(view);
}
function lockNow(mode){
  if(!hasPin())return;
  mode=mode||'lock';
  LK.on=true;LK.mode=mode;LK.view='pad';LK.buf='';LK.busy=false;LK.err=false;LK.cover=false;
  LK.msg=mode==='kiosk'?'Enter your PIN to leave kiosk mode':'Enter your PIN';
  if(mode==='lock'){
    ssDel('talaan-unlk');
    if(CAM.on&&!CAM.kiosk)camStop();
    S.sheet=null;$('#sheet').innerHTML='';$('#app').innerHTML='';$('#print').innerHTML='';
  }
  paintLock('pad');
}
function lockOpen(){
  var m=LK.mode;LK.on=false;LK.buf='';paintLock(null);ssSet('talaan-unlk','1');ssDel('talaan-hidat');
  if(m==='kiosk'){kioskStop();return}
  render();renderSheet();
  if(kioskFlag())kioskStart();
}
async function lockKey(k){
  if(!LK.on||LK.view!=='pad'||LK.busy)return;
  var c=pinCfg();if(!c)return;
  var lo=lockoutInfo(),now=Date.now();
  if(lo.until>now){LK.err=true;LK.msg='Too many tries. Wait '+Math.ceil((lo.until-now)/1000)+' seconds.';paintLock('pad');return}
  if(k==='del')LK.buf=LK.buf.slice(0,-1);else if(LK.buf.length<c.n)LK.buf+=k;
  LK.err=false;
  if(LK.buf.length<c.n){paintLock('pad');return}
  LK.busy=true;paintLock('pad');
  var ok=await verifyPin(LK.buf);
  LK.busy=false;
  if(ok){setLockout(0,0);lockOpen();return}
  var f=lo.fails+1,until=0;
  if(f%5===0)until=Date.now()+Math.min(600000,30000*Math.pow(2,f/5-1));
  setLockout(f,until);LK.buf='';LK.err=true;
  LK.msg=until?'Too many tries. Wait '+Math.ceil((until-Date.now())/1000)+' seconds.':'Wrong PIN. Try again.';
  paintLock('pad');
}
async function doPinForm(){
  var sh=S.sheet;if(!sh||sh.type!=='pin')return;
  var mode=sh.mode,p0=String(S.f['f-pin0']||''),p1=String(S.f['f-pin1']||''),p2=String(S.f['f-pin2']||'');
  S.err='';
  if(mode==='change'||mode==='off'){
    if(!(await verifyPin(p0))){S.err='The current PIN is wrong.';renderSheet();return}
  }
  if(mode==='off'){
    ls.set('talaan-pin','');ls.set('talaan-pinfail','');['f-pin0','f-pin1','f-pin2'].forEach(function(k){delete S.f[k]});
    S.sheet=null;renderSheet();render();toast('PIN lock is off.');return;
  }
  if(!/^\d{4,6}$/.test(p1)){S.err='The PIN must be 4 to 6 digits.';renderSheet();return}
  if(p1!==p2){S.err='The two PINs do not match.';renderSheet();return}
  var old=pinCfg(),sb=new Uint8Array(12),salt='';
  try{crypto.getRandomValues(sb)}catch(e){for(var q=0;q<12;q++)sb[q]=Math.floor(Math.random()*256)}
  for(var z=0;z<sb.length;z++)salt+=(sb[z]%36).toString(36);
  var h=await pinHash(p1,salt);
  ls.set('talaan-pin',JSON.stringify({s:salt,h:h,n:p1.length,after:old&&old.after!==undefined?old.after:0,v:2}));
  setLockout(0,0);ssSet('talaan-unlk','1');
  ['f-pin0','f-pin1','f-pin2'].forEach(function(k){delete S.f[k]});
  S.sheet=null;S.err='';renderSheet();render();
  if(mode==='kiosk')kioskAsk();else toast('PIN lock is on.');
}

  if(!c)return h+'<p class="hint">Student names and ID numbers are on this phone. With a PIN, nobody can open TALAAN without it.</p><div class="acts"><button class="btn sm pri" data-act="pinset">Set PIN</button></div></section>';

/* ---------- QR code generator (byte mode, error correction M, versions 1 to 10) ---------- */
var QR_ECC=[0,10,16,26,18,24,16,18,22,22,26];
var QR_BLK=[0,1,1,1,2,2,4,4,4,5,5];

}

    var dat=data.slice(k,k+sl-el+(i<ns?0:1));k+=dat.length;
    var ecc=qrRem(dat,div);
    if(i<ns)dat.push(0);
    blocks.push(dat.concat(ecc));
  }
  var out=[];
  for(i=0;i<blocks[0].length;i++){blocks.forEach(function(b,j){if(i!==sl-el||j>=ns)out.push(b[i])})}
  return out;
}

  function bit(x,n){return ((x>>>n)&1)!==0}

        case 5:inv=xx*yy%2+xx*yy%3===0;break;
        case 6:inv=(xx*yy%2+xx*yy%3)%2===0;break;
        default:inv=((xx+yy)%2+xx*yy%3)%2===0;
      }
      if(inv&&!fn[yy][xx])mod[yy][xx]=!mod[yy][xx];
    }
  }
  function hist(len,h){if(h[0]===0)len+=size;h.pop();h.unshift(len)}
  function countPat(h){
    var nn=h[1],core=nn>0&&h[2]===nn&&h[3]===nn*3&&h[4]===nn&&h[5]===nn;
    return (core&&h[0]>=nn*4&&h[6]>=nn?1:0)+(core&&h[6]>=nn*4&&h[0]>=nn?1:0);
  }
  function term(color,len,h){if(color){hist(len,h);len=0}len+=size;hist(len,h);return countPat(h)}
  function penalty(){
    var r=0,a,b,c,color,run,h;
    for(a=0;a<size;a++){
      color=false;run=0;h=[0,0,0,0,0,0,0];
      for(b=0;b<size;b++){
        if(mod[a][b]===color){run++;if(run===5)r+=3;else if(run>5)r++}
        else{hist(run,h);if(!color)r+=countPat(h)*40;color=mod[a][b];run=1}
      }
      r+=term(color,run,h)*40;
    }
    for(b=0;b<size;b++){
      color=false;run=0;h=[0,0,0,0,0,0,0];
      for(a=0;a<size;a++){
        if(mod[a][b]===color){run++;if(run===5)r+=3;else if(run>5)r++}
        else{hist(run,h);if(!color)r+=countPat(h)*40;color=mod[a][b];run=1}
      }
      r+=term(color,run,h)*40;
    }
    for(a=0;a<size-1;a++)for(b=0;b<size-1;b++){
      c=mod[a][b];
      if(c===mod[a][b+1]&&c===mod[a+1][b]&&c===mod[a+1][b+1])r+=3;
    }
    var dark=0;for(a=0;a<size;a++)for(b=0;b<size;b++)if(mod[a][b])dark++;
    var tot=size*size,kk=Math.ceil(Math.abs(dark*20-tot*10)/tot)-1;
    return r+kk*10;
  }
  var best=0,bestP=1e9,m;
  for(m=0;m<8;m++){
    applyMask(m);formatBits(m);
    var pp=penalty();
    if(pp<bestP){bestP=pp;best=m}
    applyMask(m);
  }
  applyMask(best);formatBits(best);
  return mod;
}
function qrSVG(text){
  var m=qrMatrix(text);if(!m)return '';

  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 '+(n+8)+' '+(n+8)+'" shape-rendering="crispEdges"><rect x="-4" y="-4" width="'+(n+8)+'" height="'+(n+8)+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}

function stuAtt(){

  h+=stuChart(d,rows);
  h+='<section class="card">'+(rows.length?rows.map(function(r){

     +'<div><label for="f-exdate">Date of absence</label><input type="date" id="f-exdate" min="'+ymd(lo)+'" max="'+ymd(hi)+'" value="'+esc(fv('f-exdate',ST.ex.d))+'"></div>'
     +'<div><label for="f-exwhy">Reason</label><textarea id="f-exwhy" rows="4" maxlength="500" placeholder="Why were you or will you be absent?">'+esc(fv('f-exwhy'))+'</textarea></div>'
     +'<div><label for="f-stuimg">Picture of your letter or medical certificate (optional)</label><input type="file" id="f-stuimg" accept="image/*">'+(ST.img?'<img class="stu-pic" src="'+ST.img+'" alt="Your letter"><button class="link" type="button" data-act="stunoimg">Remove picture</button>':'')+'</div>'

  }

async function excLoad(silent){
  if(!S.gs||!S.gs.role||!S.gs.url||navigator.onLine===false)return;
  var r;try{r=await gsRead({action:'excList'})}catch(e){if(!silent)toast('Could not load excuse letters.');return}
  if(r&&r.ok){EX.rows=r.rows||[];EX.ok=true;if(S.sheet&&S.sheet.type==='exc')renderSheet();else if(S.tab==='scan')render()}
}
function excCard(){
  if(!S.gs||!S.gs.role||!S.gs.url)return '';
  var p=EX.rows.filter(function(x){return x.st==='Pending'}).length;
  return '<section class="card"><div><h3 class="h3">Student portal</h3><span class="sub hint">'+(EX.ok?(p?p+' excuse letter'+(p>1?'s':'')+' waiting for review':'No letters waiting'):'Excuse letters and announcements')+'</span></div><div class="acts"><button class="btn'+(p?' pri':'')+'" data-act="exopen">Excuse letters'+(p?' ('+p+')':'')+'</button><button class="btn" data-act="annopen">Announcements</button></div></section>';
}
function excSheetHTML(){
  var rows=EX.rows.slice().sort(function(a,b){return (a.st==='Pending'?0:1)-(b.st==='Pending'?0:1)}).slice(0,25);

    var pend=x.st==='Pending',pc=x.st==='Approved'?'present':x.st==='Rejected'?'bad':'late';

     +(pend?'<div><label for="f-exn-'+esc(x.id)+'">Note to student (optional)</label><input type="text" id="f-exn-'+esc(x.id)+'" value="'+esc(fv('f-exn-'+x.id))+'" maxlength="200"></div><div class="acts"><button class="btn pri" data-act="exrev" data-id="'+esc(x.id)+'" data-v="approved"'+(EX.busy?' disabled':'')+'>Approve</button><button class="btn bad" data-act="exrev" data-id="'+esc(x.id)+'" data-v="rejected"'+(EX.busy?' disabled':'')+'>Reject</button></div>'
      :'<span class="sub hint" style="display:block">'+(x.by?'By '+esc(x.by)+' \u00b7 ':'')+esc(x.at||'')+(x.note?' \u00b7 '+esc(x.note):'')+'</span>')+'</div>'}).join(''):'<p class="muted">No letters yet.</p>')+'<button class="btn" data-act="closesheet">Close</button></div>';

async function excImg(id){
  toast('Loading letter...');var r;try{r=await gsRead({action:'excImg',id:id})}catch(e){toast('Could not load the picture.');return}
  if(r&&r.ok){EX.img[id]=r.img;renderSheet()}else toast('The picture is not available.');
}
async function excReview(id,v){
  if(EX.busy)return;EX.busy=true;renderSheet();var r;
  try{r=await gsRead({action:'excReview',id:id,decision:v,note:String(S.f['f-exn-'+id]||'').trim()})}catch(e){r=null}
  EX.busy=false;
  if(r&&r.ok){toast(v==='approved'?'Approved. Attendance is now Excused.':'Rejected.');delete S.f['f-exn-'+id];logAct('Excuse letter '+v,'');await excLoad(true);gsPullAt=0;gsPull(true)}
  else{toast(r&&r.error==='done'?'Already reviewed.':'Could not save. Check your internet, and that the script is updated.');renderSheet()}
}
